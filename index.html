<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel KOMMO – Follow-up e Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#edf3f1;
      --bg-strong:#e1ece8;
      --card:#ffffff;
      --card-alt:#f7faf9;
      --ink:#122a2b;
      --mut:#5b726d;
      --line:#dfe9e4;
      --primary:#0f766e;
      --primary-strong:#0b625c;
      --primary-soft:#dcf8f3;
      --gold:#d89b20;
      --gold-soft:#fff4d8;
      --blue:#2c5e9a;
      --blue-soft:#edf4ff;
      --purple:#6f5ab3;
      --purple-soft:#f1ebff;
      --red:#d84f62;
      --red-soft:#ffe8ee;
      --success:#1a8a5a;
      --success-soft:#ebfbf1;
      --warning:#c78112;
      --warning-soft:#fff4d8;
      --shadow:0 12px 30px rgba(16, 35, 32, 0.08), 0 2px 10px rgba(16, 35, 32, 0.04);
      --radius:18px;
      color-scheme:light;
      box-sizing:border-box;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      background:linear-gradient(180deg, #edf3f1 0%, #edf5f3 100%);
      color:var(--ink);
      font:15px/1.5 "Figtree", system-ui, sans-serif;
      overflow-x:hidden;
    }
    body.locked { overflow:hidden; }
    .app-shell { display:none; }
    body:not(.locked) .app-shell { display:block; }

    .lock-screen {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at top, #f5faf8 0%, #e8f0ee 38%, #dfeae6 100%);
      z-index:2000;
    }
    body:not(.locked) .lock-screen { display:none; }

    .lock-card {
      width:min(92vw, 400px);
      background:rgba(255,255,255,0.97);
      border:1px solid rgba(17,43,43,0.08);
      border-radius:26px;
      padding:30px 24px 22px;
      box-shadow:0 32px 80px rgba(14, 36, 32, 0.15);
      text-align:center;
    }
    .lock-icon { font-size:46px; margin-bottom:8px; }
    .lock-card h2 {
      margin:0 0 14px;
      font-size:28px;
      letter-spacing:-0.04em;
      color:var(--ink);
    }
    .lock-card label {
      display:block;
      text-align:left;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:var(--mut);
      margin:12px 0 8px;
    }
    .lock-card input {
      width:100%;
      min-height:52px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 14px;
      background:#fff;
      color:var(--ink);
      font:inherit;
    }
    .lock-card input:focus {
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(15,118,110,0.12);
    }
    .lock-card button {
      width:100%;
      min-height:50px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      color:#fff;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      margin-top:10px;
      box-shadow:0 16px 30px rgba(15,118,110,0.22);
    }
    .lock-card button:hover { filter:brightness(1.03); }
    #lockMessage {
      min-height:18px;
      margin:12px 0 0;
      color:var(--red);
      font-weight:700;
      font-size:14px;
    }

    header {
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:16px max(22px, calc((100% - 1200px)/2));
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }
    .brand { display:flex; flex-direction:column; gap:2px; }
    .brand h1 {
      margin:0;
      font-size:20px;
      letter-spacing:-0.04em;
    }
    #st {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:2px;
      font-size:12px;
      font-weight:700;
      color:var(--mut);
    }
    #st::before {
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--success);
      display:inline-block;
      box-shadow:0 0 0 5px rgba(26,138,90,0.08);
    }

    nav {
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:6px;
      padding:5px;
      background:var(--bg);
      border:1px solid var(--line);
      border-radius:12px;
    }
    nav button {
      border:none;
      background:transparent;
      color:var(--mut);
      font:inherit;
      font-weight:700;
      padding:9px 14px;
      border-radius:10px;
      cursor:pointer;
      transition:all .2s ease;
    }
    nav button.on {
      background:linear-gradient(135deg, var(--primary), #0d9186);
      color:#fff;
      box-shadow:0 8px 20px rgba(16,120,110,0.18);
    }

    main {
      max-width:1200px;
      margin:0 auto;
      padding:22px max(22px, calc((100% - 1200px)/2)) 40px;
    }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      min-width:0;
      box-shadow:var(--shadow);
    }
    .card-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .card-header h2, .card-header h3 {
      margin:0;
      font-size:16px;
      letter-spacing:-0.03em;
    }
    .eyebrow {
      display:inline-block;
      margin:0 0 8px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:var(--mut);
    }

    .grid { display:grid; gap:14px; }
    .kpis { grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-bottom:14px; }
    .kpi {
      position:relative;
      overflow:hidden;
      padding:16px 16px 14px 18px;
      border-left:4px solid var(--primary);
      border-radius:12px;
      background:var(--card);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }
    .kpi:nth-child(2) { border-left-color: var(--blue); }
    .kpi:nth-child(3) { border-left-color: var(--gold); }
    .kpi:nth-child(4) { border-left-color: var(--purple); }
    .kpi span {
      display:block;
      font-size:11.5px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:var(--mut);
    }
    .kpi b {
      display:block;
      font-size:30px;
      line-height:1.1;
      margin-top:6px;
      letter-spacing:-.02em;
    }
    .kpi small {
      display:block;
      line-height:1.35;
      margin-top:4px;
      color:var(--mut);
      font-size:12px;
    }

    .ins {
      background:rgba(217,154,28,.08);
      border:1px solid rgba(217,154,28,.34);
      border-left:4px solid var(--gold);
      border-radius:12px;
      padding:12px 16px;
      margin-bottom:14px;
      font-size:14px;
    }
    .ins p { margin:3px 0; }

    .charts { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
    .chart-wrap {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px;
      min-height:330px;
    }
    .chart-legend {
      display:flex;
      flex-wrap:wrap;
      gap:10px 14px;
      font-size:12px;
      color:var(--mut);
      margin:8px 0 12px;
      font-weight:700;
    }
    .legend-dot {
      display:inline-block;
      width:10px;
      height:10px;
      border-radius:2px;
      margin-right:6px;
      vertical-align:-1px;
    }
    svg { width:100%; height:auto; display:block; }
    svg text { fill:var(--mut); font-size:10.5px; font-family:inherit; }

    .section-grid {
      display:grid;
      gap:18px;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      margin-top:18px;
    }
    .summary-table { width:100%; border-collapse:collapse; font-size:13px; }
    .summary-table td, .summary-table th {
      padding:10px 8px;
      border-bottom:1px solid var(--line);
      text-align:left;
    }
    .summary-table th {
      color:var(--mut);
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .summary-table tr:last-child td { border-bottom:none; }
    .summary-table tr:hover td { background:rgba(15,118,110,0.03); }

    .field, .filter-box, .mini-btn, .primary-btn, .ghost-btn, .field input, .field select, .field textarea {
      font:inherit;
      color:var(--ink);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      min-height:40px;
      padding:8px 10px;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    .field {
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:12px;
      color:var(--mut);
      font-weight:700;
    }
    .field input, .field select, .field textarea, .filter-box { width:100%; min-height:42px; }
    .field input:focus, .field select:focus, .field textarea:focus, .filter-box:focus {
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(15,118,110,0.12);
    }
    .field textarea { min-height:96px; resize:vertical; }
    .form-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:12px;
    }
    .row {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin-top:16px;
    }
    .toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:end;
      margin:0 0 12px;
    }
    .primary-btn, .ghost-btn, .mini-btn {
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
    }
    .primary-btn {
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      border-color:var(--primary);
      color:#fff;
      box-shadow:0 10px 20px rgba(15,118,110,0.2);
      min-height:42px;
      padding-inline:16px;
    }
    .ghost-btn {
      background:transparent;
      color:var(--ink);
      border-color:var(--line);
      min-height:40px;
      padding-inline:14px;
    }
    .ghost-btn:hover, .mini-btn:hover, .primary-btn:hover { filter:brightness(1.02); }
    .mini-btn {
      background:var(--card-alt);
      border-color:var(--line);
      color:var(--ink);
      min-height:34px;
      padding:6px 10px;
      font-size:12px;
    }
    .del-btn {
      color:var(--red);
      border-color:rgba(217,77,99,0.2);
      background:var(--red-soft);
    }

    .table-wrap {
      overflow:auto;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--card);
    }
    table {
      width:100%;
      border-collapse:collapse;
      min-width:980px;
      font-size:13px;
    }
    th, td {
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:middle;
    }
    th {
      background:var(--card-alt);
      color:var(--mut);
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
      position:sticky;
      top:0;
      z-index:1;
    }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(15,118,110,0.025); }
    .empty-state {
      padding:22px 14px;
      color:var(--mut);
      font-size:14px;
      background:var(--card-alt);
      border:1px dashed var(--line);
      border-radius:12px;
      text-align:center;
    }

    .filter-box { background:var(--card-alt); }
    .filter-legend {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:12px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--card-alt);
      color:var(--mut);
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.06em;
    }
    .filter-legend .dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--primary);
      display:inline-block;
    }

    .sync-box {
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:14px;
    }
    .sync-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      background:var(--card-alt);
      border:1px solid var(--line);
      border-radius:12px;
    }
    .sync-status {
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background:#fff;
      border:1px solid var(--line);
    }
    .sync-status::before {
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      display:inline-block;
      background:var(--warning);
    }
    .sync-status.good::before { background:var(--success); }
    .sync-status.error::before { background:var(--red); }
    .sync-status.none::before { background:var(--warning); }
    .sync-status.good { color:var(--success); }
    .sync-status.error { color:var(--red); }
    .sync-status.none { color:var(--warning); }

    .config-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:12px;
    }
    .note { font-size:13px; color:var(--mut); line-height:1.45; }
    #msg {
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:9999;
      background:rgba(17,42,43,0.96);
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      font-size:13px;
      font-weight:700;
      box-shadow:0 12px 28px rgba(0,0,0,.22);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
    }
    #msg.on { opacity:1; }

    @media (max-width:720px){
      header { padding:14px 14px 16px; }
      main { padding:18px 14px 36px; }
      .card { padding:14px; }
      .kpi b { font-size:26px; }
      .table-wrap { margin-top:8px; }
    }
  </style>
</head>
<body class="locked">
  <div id="lockScreen" class="lock-screen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h2 id="lockTitle">Senha de Acesso</h2>
      <form id="lockForm" novalidate>
        <label for="accessPassword">Senha</label>
        <input id="accessPassword" type="password" placeholder="Digite a senha" autocomplete="off" aria-label="Senha de Acesso">
        <button type="submit">Entrar</button>
        <p id="lockMessage" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <header>
      <div class="brand">
        <h1 id="ttl">Painel KOMMO</h1>
        <div id="st">Sistema ativo</div>
      </div>
      <nav id="nav">
        <button type="button" data-tab="dash" class="on">Painel</button>
        <button type="button" data-tab="sem">Lançar semana</button>
        <button type="button" data-tab="cons">Consultas</button>
        <button type="button" data-tab="cfg">Configuração</button>
      </nav>
    </header>

    <main>
      <section id="dash" class="tab-panel active"></section>
      <section id="sem" class="tab-panel"></section>
      <section id="cons" class="tab-panel"></section>
      <section id="cfg" class="tab-panel"></section>
    </main>
  </div>

  <div id="msg"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'kommo_dashboard_data';
      const SHEETDB_WEEK_URL = 'https://sheetdb.io/api/v1/hd148z3uhn04n';
      const SHEETDB_CONSULTA_URL = 'https://sheetdb.io/api/v1/antynpy96prfl';
      const ACCESS_PASSWORD = 'Lucas830';
      const FIELDS = [
        ['novos','Novos leads'],
        ['antigas','Conversas antigas retomadas'],
        ['ativas','Total de conversas ativas'],
        ['fu2','Follow-up 2'],
        ['fu3','Follow-up 3'],
        ['fu4','Follow-up 4'],
        ['fu5','Follow-up 5'],
        ['resp','Respostas'],
        ['m1','Mensagens 1'],
        ['m2','Mensagens 2'],
        ['m3','Mensagens 3'],
        ['m4','Mensagens 4'],
        ['m5','Mensagens 5'],
        ['m6','Mensagens 6'],
        ['cagend','Consultas agendadas'],
        ['tcap','Total atual']
      ];

      const state = {
        weeks: {},
        appts: [],
        cfg: { title: 'Painel KOMMO', password: ACCESS_PASSWORD, filterLimit: 30 },
        sync: { weeks: 'none', appointments: 'none' }
      };

      function safeNumber(value) {
        if (value === null || value === undefined || value === '') return 0;
        const text = String(value).trim();
        if (!text) return 0;
        const normalized = text
          .replace(/\s+/g, '')
          .replace(/\./g, '')
          .replace(/,/g, '.')
          .replace(/[^0-9.\-]/g, '');
        if (!normalized) return 0;
        const n = Number(normalized);
        return Number.isFinite(n) ? n : 0;
      }

      function parseDateValue(value) {
        if (value === null || value === undefined) return null;
        const text = String(value).trim();
        if (!text) return null;

        if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
          const d = new Date(text + 'T00:00:00');
          return Number.isNaN(d.getTime()) ? null : text;
        }

        const match = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if (match) {
          let day = Number(match[1]);
          let month = Number(match[2]);
          let year = Number(match[3]);
          if (year < 100) year += 2000;
          const d = new Date(year, month - 1, day);
          if (Number.isNaN(d.getTime())) return null;
          return d.toISOString().slice(0, 10);
        }

        const d = new Date(text);
        if (Number.isNaN(d.getTime())) return null;
        return d.toISOString().slice(0, 10);
      }

      function formatDateBR(value) {
        const iso = parseDateValue(value);
        if (!iso) return '—';
        const d = new Date(iso + 'T00:00:00');
        if (Number.isNaN(d.getTime())) return '—';
        return d.toLocaleDateString('pt-BR');
      }

      function formatNumber(value, digits = 0) {
        const n = Number(value) || 0;
        return new Intl.NumberFormat('pt-BR', {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        }).format(n);
      }

      function normalizeWeekRecord(record) {
        const out = {};
        FIELDS.forEach(([key]) => {
          out[key] = safeNumber(record && record[key]);
        });
        return out;
      }

      function normalizeAppointment(item) {
        if (!item || typeof item !== 'object') return null;
        return {
          paciente: item.paciente || '',
          origem: item.origem || 'Instagram',
          agendada_em: item.agendada_em || '',
          data_consulta: item.data_consulta || '',
          status: item.status || 'agendada'
        };
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { weeks: {}, appts: [], cfg: { ...state.cfg }, sync: { ...state.sync } };
          const parsed = JSON.parse(raw);
          const weeks = {};
          if (parsed && parsed.weeks && typeof parsed.weeks === 'object') {
            Object.keys(parsed.weeks).forEach(dateKey => {
              const iso = parseDateValue(dateKey);
              if (!iso) return;
              weeks[iso] = normalizeWeekRecord(parsed.weeks[dateKey]);
            });
          }
          const appts = Array.isArray(parsed && parsed.appts) ? parsed.appts.map(normalizeAppointment).filter(Boolean) : [];
          return {
            weeks,
            appts,
            cfg: parsed && parsed.cfg ? { ...state.cfg, ...parsed.cfg } : { ...state.cfg },
            sync: parsed && parsed.sync ? { ...state.sync, ...parsed.sync } : { ...state.sync }
          };
        } catch (error) {
          console.error('Erro ao ler localStorage:', error);
          return { weeks: {}, appts: [], cfg: { ...state.cfg }, sync: { ...state.sync } };
        }
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          weeks: state.weeks,
          appts: state.appts,
          cfg: state.cfg,
          sync: state.sync
        }));
      }

      function toast(message) {
        const el = document.getElementById('msg');
        if (!el) return;
        el.textContent = message;
        el.classList.add('on');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove('on'), 2200);
      }

      function getAllWeeksSorted() {
        return Object.keys(state.weeks).sort();
      }

      function getFilteredWeeks() {
        const search = document.getElementById('weekFilterSearch')?.value.trim().toLowerCase() || '';
        const from = document.getElementById('weekStartFilter')?.value || '';
        const to = document.getElementById('weekEndFilter')?.value || '';

        return getAllWeeksSorted().filter(date => {
          const item = state.weeks[date] || {};
          const hay = Object.values(item).join(' ').toLowerCase();
          const matchSearch = !search || date.includes(search) || hay.includes(search);
          const matchFrom = !from || date >= from;
          const matchTo = !to || date <= to;
          return matchSearch && matchFrom && matchTo;
        });
      }

      function buildWeekFields() {
        const wrapper = document.getElementById('wf');
        if (!wrapper) return;

      function drawChart() {
        const svg = document.getElementById('mainChart');
        if (!svg) return;
        const weeks = getAllWeeksSorted();
        if (!weeks.length) { svg.innerHTML = ''; return; }

        const width = 960;
        const height = 260;
        const padding = { top: 20, right: 20, bottom: 30, left: 40 };
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;
        const values = weeks.map(date => {
          const item = state.weeks[date] || {};
          return [
            safeNumber(item.ativas),
            safeNumber(item.fu2) + safeNumber(item.fu3) + safeNumber(item.fu4) + safeNumber(item.fu5),
            safeNumber(item.resp)
          ];
        });
        const maxValue = Math.max(...values.flat(), 10);
        const gap = 18;
        const barWidth = (plotWidth - gap * (weeks.length - 1)) / (weeks.length * 3);

        const grid = Array.from({ length: 5 }, (_, index) => {
          const y = padding.top + (plotHeight / 4) * index;
          const value = Math.round(maxValue - (maxValue / 4) * index);
          return `
            <g>
              <line x1="${padding.left}" x2="${width - padding.right}" y1="${y}" y2="${y}" stroke="rgba(22,48,44,.12)" stroke-dasharray="4 6"></line>
              <text x="4" y="${y + 4}" fill="var(--mut)">${value}</text>
            </g>
          `;
        }).join('');

        const bars = weeks.map((date, index) => {
          const item = state.weeks[date] || {};
          const ativas = safeNumber(item.ativas);
          const follow = safeNumber(item.fu2) + safeNumber(item.fu3) + safeNumber(item.fu4) + safeNumber(item.fu5);
          const resp = safeNumber(item.resp);
          const startX = padding.left + (index * barWidth * 3) + index * gap;
          const hAtivas = (ativas / maxValue) * plotHeight;
          const hFollow = (follow / maxValue) * plotHeight;
          const hResp = (resp / maxValue) * plotHeight;
          const label = new Date(date + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

          return `
            <g>
              <rect x="${startX}" y="${padding.top + plotHeight - hAtivas}" width="${barWidth * 0.8}" height="${hAtivas}" fill="var(--primary)" rx="4"></rect>
              <rect x="${startX + barWidth}" y="${padding.top + plotHeight - hFollow}" width="${barWidth * 0.8}" height="${hFollow}" fill="var(--blue)" rx="4"></rect>
              <rect x="${startX + barWidth * 2}" y="${padding.top + plotHeight - hResp}" width="${barWidth * 0.8}" height="${hResp}" fill="var(--gold)" rx="4"></rect>
              <text x="${startX + barWidth}" y="${height - 8}" text-anchor="middle">${label}</text>
            </g>
          `;
        }).join('');

        svg.innerHTML = `${grid}${bars}`;
      }

      function parseAppointmentText(text) {
        if (!text) return null;
        const cleaned = String(text).trim();
        if (!cleaned) return null;

        const slashMatch = cleaned.match(/^(.+?)\s*\/\s*(.+?)\s*\/\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\s*\/\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})$/);
        if (slashMatch) {
          return {
            paciente: slashMatch[1].trim(),
            origem: slashMatch[2].trim() || 'Instagram',
            agendada_em: parseDateValue(slashMatch[3]),
            data_consulta: parseDateValue(slashMatch[4]),
            status: 'agendada'
          };
        }

        const keywordMatch = cleaned.match(/(?:agendada\s*em|agendado\s*em|data\s*agendada)\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i);
        const consultaMatch = cleaned.match(/(?:data\s*da\s*consulta|consulta)\s*[:\-]?\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i);
        const pacienteMatch = cleaned.match(/^(.+?)\s*\/\s*(.+?)(?:\s*\/\s*(?:\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\s*\/\s*\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})$/);

        if (keywordMatch || consultaMatch || pacienteMatch) {
          const base = (patient => patient ? patient[1].trim() : '')(
            cleaned.match(/^(.+?)\s*\/\s*(.+?)(?:\s*\/\s*\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\s*\/\s*\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})$/)
          );

          const origem = cleaned.match(/^.+?\s*\/\s*(.+?)\s*\/\s*\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\s*\/\s*\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/);

          return {
            paciente: base || cleaned.split(/\s*\/\s*/)[0].trim() || 'Paciente',
            origem: (origem && origem[1] ? origem[1].trim() : 'Instagram'),
            agendada_em: parseDateValue(keywordMatch ? keywordMatch[1] : (cleaned.match(/^.+?\s*\/\s*.+?\s*\/\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\s*\/\s*\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/) || [])[1] || '')),
            data_consulta: parseDateValue(consultaMatch ? consultaMatch[1] : (cleaned.match(/^.+?\s*\/\s*.+?\s*\/\s*\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\s*\/\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})$/) || [])[1] || '')),
            status: 'agendada'
          };
        }

        return null;
      }

      function getFilteredAppointments() {
        const search = document.getElementById('apptSearch')?.value.trim().toLowerCase() || '';

        const consultation = document.getElementById('apptConsultationFilter')?.value || '';

        return state.appts.filter(item => {
          const paciente = (item.paciente || '').toLowerCase();
          const origem = (item.origem || '').toLowerCase();
          const statusText = (item.status || '').toLowerCase();
          const scheduledIso = parseDateValue(item.agendada_em);
          const consultationIso = parseDateValue(item.data_consulta);

          const matchSearch = !search || paciente.includes(search) || origem.includes(search) || statusText.includes(search);
          const matchOrigin = !origin || (item.origem || '') === origin;
          const matchScheduled = !scheduled || scheduledIso === scheduled;
          const matchConsultation = !consultation || consultationIso === consultation;
          const matchStatus = !status || statusText === status;

          return matchSearch && matchOrigin && matchScheduled && matchConsultation && matchStatus;
        });
      }

                  <strong>Consultas</strong>
                  <div class="note">Sincronização das consultas</div>
                </div>
                <div class="sync-status ${state.sync.appointments === 'good' ? 'good' : state.sync.appointments === 'error' ? 'error' : 'none'}">
                  ${state.sync.appointments === 'good' ? 'Sucesso' : state.sync.appointments === 'error' ? 'Erro' : 'Não sincronizado'}
                </div>
              </div>
            </div>
            <div class="row"><button class="primary-btn" id="retrySync" type="button">Nova tentativa de sincronização</button></div>
          </div>
        `;

        document.getElementById('saveCfg')?.addEventListener('click', saveConfig);
        document.getElementById('retrySync')?.addEventListener('click', retrySync);
      }

      function saveConfig() {
        const title = document.getElementById('cfgTitle')?.value.trim() || 'Painel KOMMO';
        const pass = document.getElementById('cfgPass')?.value.trim() || ACCESS_PASSWORD;
        const limit = Number(document.getElementById('cfgLimit')?.value || 30);
        state.cfg.title = title;
        state.cfg.password = pass;
        state.cfg.filterLimit = Number.isFinite(limit) && limit > 0 ? limit : 30;
        saveData();
        applyTitle();
        renderAll();
        toast('Configuração salva.');
      }

      function applyTitle() {
        const title = state.cfg.title || 'Painel KOMMO';
        const ttl = document.getElementById('ttl');
        if (ttl) ttl.textContent = title;
      }

      function saveWeek() {
        const date = parseDateValue(document.getElementById('wd')?.value || '');
        if (!date) {
          toast('Data inválida. Corrija a data da semana.');
          return;
        }
        const payload = readWeekForm();
        state.weeks[date] = payload;
        saveData();
        renderAll();
        syncWeeksToSheetDB(date, payload);
        toast('Semana salva com sucesso.');
      }

      function copyPreviousWeek() {
        const dates = getAllWeeksSorted();
        if (!dates.length) {
          toast('Nenhuma semana anterior para copiar.');
          return;
        }
        const prevDate = dates[dates.length - 1];
        const source = state.weeks[prevDate];
        if (!source) {
          toast('Semana anterior inválida.');
          return;
        }
        const input = document.getElementById('wd');
        if (input) input.value = prevDate;
        populateWeekFields(source);
        toast('Valores copiados da semana anterior.');
      }

      function deleteCurrentWeek() {
        const date = parseDateValue(document.getElementById('wd')?.value || '');
        if (!date) {
          toast('Selecione uma semana válida para excluir.');
          return;
        }
        delete state.weeks[date];
        saveData();
        renderAll();
        toast('Semana removida.');
      }

      function importFromPaste() {
        const text = document.getElementById('paste')?.value.trim();
        if (!text) {
          toast('Cole os dados da planilha para importar.');
          return;
        }

        let imported = 0;
        const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
        lines.forEach(line => {
          const cells = line.split(/\t|\s{2,}|\s*;\s*/).map(v => v.trim()).filter(Boolean);
          if (!cells.length) return;
          const [first, ...rest] = cells;
          const iso = parseDateValue(first);
          if (!iso) return;
          const item = { data_semana: iso };
          FIELDS.forEach(([key], index) => {
            item[key] = safeNumber(rest[index] || 0);
          });
          state.weeks[iso] = normalizeWeekRecord(item);
          imported += 1;
        });

        if (!imported) {
          toast('Nenhuma linha válida foi encontrada.');
          return;
        }

        saveData();
        renderAll();
        document.getElementById('paste').value = '';
        toast('Dados importados com sucesso.');
      }

      function addAppointment() {
        const nome = document.getElementById('cp_n')?.value.trim();
        const origem = document.getElementById('cp_o')?.value || 'Instagram';
        const agendada = document.getElementById('cp_s')?.value || '';
        const consulta = document.getElementById('cp_c')?.value || '';

        if (!nome || !consulta) {
          toast('Preencha paciente e data da consulta.');
          return;
        }

        const item = normalizeAppointment({
          paciente: nome,
          origem,
          agendada_em: parseDateValue(agendada) || agendada,
          data_consulta: parseDateValue(consulta) || consulta,
          status: 'agendada'
        });

        if (!item) return;
        state.appts.push(item);
        saveData();
        renderConsultsTab();
        renderDashboard();

        document.getElementById('cp_n').value = '';
        document.getElementById('cp_o').value = 'Instagram';
        document.getElementById('cp_s').value = new Date().toISOString().slice(0, 10);
        document.getElementById('cp_c').value = '';

        syncAppointmentsToSheetDB(item);
        toast('Consulta adicionada com sucesso.');
      }

      function importAppointments() {
        const text = document.getElementById('cp_paste')?.value.trim();
        if (!text) {
          toast('Cole os dados do paciente para importar.');
          return;
        }

        let imported = 0;
        const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
        lines.forEach(line => {
          const parsed = parseAppointmentText(line);
          if (!parsed) return;
          const item = normalizeAppointment(parsed);
          if (!item) return;
          state.appts.push(item);
          imported += 1;
        });

        if (!imported) {
          toast('Nenhum registro válido foi encontrado.');
          return;
        }

        saveData();
        renderConsultsTab();
        document.getElementById('cp_paste').value = '';
        toast('Consultas importadas com sucesso.');
      }

      function updateAppointmentStatus(index, status) {
        if (index < 0 || !state.appts[index]) return;
        state.appts[index].status = status;
        saveData();
        renderAppointmentsTable();
      }

      function deleteAppointment(index) {
        if (index === undefined || index < 0 || !state.appts[index]) return;
        state.appts.splice(index, 1);
        saveData();
        renderConsultsTab();
        toast('Consulta removida.');
      }

      async function postJSON(url, payload) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(Array.isArray(payload) ? payload : [payload])
        });
        const text = await response.text();
        if (!response.ok) throw new Error(text || 'Erro ao sincronizar com SheetDB');
        return text;
      }

      function syncWeeksToSheetDB(date, payload) {
        const toSend = {
          source: 'painel-kommo',
          updated_at: new Date().toISOString(),
          data_semana: date,
          novos: safeNumber(payload.novos),
          antigas: safeNumber(payload.antigas),
          ativas: safeNumber(payload.ativas),
          fu2: safeNumber(payload.fu2),
          fu3: safeNumber(payload.fu3),
          fu4: safeNumber(payload.fu4),
          fu5: safeNumber(payload.fu5),
          resp: safeNumber(payload.resp),
          m1: safeNumber(payload.m1),
          m2: safeNumber(payload.m2),
          m3: safeNumber(payload.m3),
          m4: safeNumber(payload.m4),
          m5: safeNumber(payload.m5),
          m6: safeNumber(payload.m6),
          cagend: safeNumber(payload.cagend),
          tcap: safeNumber(payload.tcap)
        };

        postJSON(SHEETDB_WEEK_URL, toSend)
          .then(() => {
            state.sync.weeks = 'good';
            saveData();
            renderConfig();
          })
          .catch((err) => {
            console.error('SheetDB weeks error:', err);
            state.sync.weeks = 'error';
            saveData();
            renderConfig();
            toast('Erro na sincronização de semanas.');
          });
      }

      function syncAppointmentsToSheetDB(item) {
        const toSend = {
          source: 'painel-kommo',
          updated_at: new Date().toISOString(),
          paciente: String(item.paciente || ''),
          origem: String(item.origem || ''),
          agendada_em: String(item.agendada_em || ''),
          data_consulta: String(item.data_consulta || ''),
          status: String(item.status || 'agendada')
        };

        postJSON(SHEETDB_CONSULTA_URL, toSend)
          .then(() => {
            state.sync.appointments = 'good';
            saveData();
            renderConfig();
          })
          .catch((err) => {
            console.error('SheetDB appointments error:', err);
            state.sync.appointments = 'error';
            saveData();
            renderConfig();
            toast('Erro na sincronização de consultas.');
          });
      }

      function retrySync() {
        const dates = getAllWeeksSorted();
        dates.forEach(date => {
          const payload = state.weeks[date];
          if (payload) syncWeeksToSheetDB(date, payload);
        });
        state.appts.forEach(item => syncAppointmentsToSheetDB(item));

        if (!dates.length && !state.appts.length) {
          state.sync.weeks = 'none';
          state.sync.appointments = 'none';
          saveData();
          renderConfig();
          toast('Nada para sincronizar no momento.');
          return;
        }
        toast('Tentativa de sincronização iniciada.');
      }

      function renderAll() {
        applyTitle();
        renderDashboard();
        renderWeekTab();
        renderConsultsTab();
        renderConfig();
      }

      function bindEvents() {
        document.querySelectorAll('[data-tab]').forEach(button => {
          button.addEventListener('click', () => {
            const target = button.dataset.tab;
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            const panel = document.getElementById(target);
            if (panel) panel.classList.add('active');
            document.querySelectorAll('[data-tab]').forEach(btn => btn.classList.toggle('on', btn === button));
          });
        });

        document.addEventListener('click', (event) => {
          const loadWeekBtn = event.target.closest('[data-load-week]');
          if (loadWeekBtn) {
            const date = loadWeekBtn.dataset.loadWeek;
            loadWeekIntoForm(date);
            toast('Semana carregada para edição.');
            return;
          }

          const deleteWeekBtn = event.target.closest('[data-delete-week]');
          if (deleteWeekBtn) {
            const date = deleteWeekBtn.dataset.deleteWeek;
            delete state.weeks[date];
            saveData();
            renderAll();
            toast('Semana removida.');
            return;
          }

          const deleteApptBtn = event.target.closest('[data-delete-appt]');
          if (deleteApptBtn) {
            deleteAppointment(Number(deleteApptBtn.dataset.deleteAppt));
          }
        });

        document.addEventListener('change', (event) => {
          const statusSelect = event.target.closest('[data-status-id]');
          if (statusSelect) {
            const idx = Number(statusSelect.dataset.statusId);
            updateAppointmentStatus(idx, statusSelect.value);
          }
        });
      }

      function initializeLock() {
        const lockForm = document.getElementById('lockForm');
        const passwordInput = document.getElementById('accessPassword');
        const lockMessage = document.getElementById('lockMessage');
        const lockScreen = document.getElementById('lockScreen');
        const appShell = document.getElementById('appShell');

        if (!lockForm || !passwordInput || !lockMessage || !lockScreen || !appShell) return;

        lockForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const password = passwordInput.value.trim();
          if (password === (state.cfg.password || ACCESS_PASSWORD)) {
            document.body.classList.remove('locked');
            lockScreen.style.display = 'none';
            appShell.style.display = 'block';
            passwordInput.value = '';
            lockMessage.textContent = '';
            return;
          }
          lockMessage.textContent = 'Senha Incorreta';
          passwordInput.value = '';
          passwordInput.focus();
        });
      }

      function init() {
        const loaded = loadData();
        state.weeks = loaded.weeks || {};
        state.appts = Array.isArray(loaded.appts) ? loaded.appts : [];
        state.cfg = loaded.cfg && Object.keys(loaded.cfg).length ? loaded.cfg : { ...state.cfg };
        state.sync = loaded.sync || { ...state.sync };

        initializeLock();
        bindEvents();
        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
