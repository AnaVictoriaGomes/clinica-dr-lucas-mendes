<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel KOMMO – Follow-up e Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#edf3f1;
      --bg-strong:#e1ece8;
      --card:#ffffff;
      --card-alt:#f7faf9;
      --ink:#122a2b;
      --mut:#5b726d;
      --line:#dfe9e4;
      --primary:#0f766e;
      --primary-strong:#0b625c;
      --primary-soft:#dcf8f3;
      --gold:#d89b20;
      --gold-soft:#fff4d8;
      --blue:#2c5e9a;
      --blue-soft:#edf4ff;
      --purple:#6f5ab3;
      --purple-soft:#f1ebff;
      --red:#d84f62;
      --red-soft:#ffe8ee;
      --success:#1a8a5a;
      --success-soft:#ebfbf1;
      --warning:#c78112;
      --warning-soft:#fff4d8;
      --shadow:0 12px 30px rgba(16,35,32,0.08), 0 2px 10px rgba(16,35,32,0.04);
      --radius:18px;
      color-scheme:light;
      box-sizing:border-box;
    }

    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      margin:0;
      background:linear-gradient(180deg,#edf3f1 0%, #edf5f3 100%);
      color:var(--ink);
      font:15px/1.5 "Figtree", system-ui, sans-serif;
      overflow-x:hidden;
    }
    body.locked{overflow:hidden;}
    .app-shell{display:none;}
    body:not(.locked) .app-shell{display:block;}

    .lock-screen{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at top, #f5faf8 0%, #e8f0ee 38%, #dfeae6 100%);
      z-index:2000;
    }
    body:not(.locked) .lock-screen{display:none;}

    .lock-card{
      width:min(92vw, 400px);
      background:rgba(255,255,255,0.97);
      border:1px solid rgba(17,43,43,0.08);
      border-radius:26px; padding:30px 24px 22px;
      box-shadow:0 32px 80px rgba(14,36,32,0.15);
      text-align:center;
    }
    .lock-icon{font-size:46px; margin-bottom:8px;}
    .lock-card h2{margin:0 0 14px; font-size:28px; letter-spacing:-0.04em; color:var(--ink);}
    .lock-card label{
      display:block; text-align:left; font-size:11px; font-weight:800;
      text-transform:uppercase; letter-spacing:0.08em; color:var(--mut);
      margin:12px 0 8px;
    }
    .lock-card input{
      width:100%; min-height:52px; border:1px solid var(--line); border-radius:14px; padding:12px 14px;
      background:#fff; color:var(--ink); font:inherit;
    }
    .lock-card input:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(15,118,110,0.12);}
    .lock-card button{
      width:100%; min-height:50px; border:none; border-radius:14px; background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      color:#fff; font:inherit; font-weight:800; cursor:pointer; margin-top:10px; box-shadow:0 16px 30px rgba(15,118,110,0.22);
    }
    .lock-card button:hover{filter:brightness(1.03);}
    #lockMessage{min-height:18px; margin:12px 0 0; color:var(--red); font-weight:700; font-size:14px;}

    header{
      position:sticky; top:0; z-index:50;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:16px max(22px, calc((100% - 1200px)/2));
      background:rgba(255,255,255,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
    }
    .brand{display:flex; flex-direction:column; gap:2px;}
    .brand h1{margin:0; font-size:20px; letter-spacing:-0.04em;}
    #st{display:inline-flex; align-items:center; gap:8px; margin-top:2px; font-size:12px; font-weight:700; color:var(--mut);}
    #st::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--success); display:inline-block; box-shadow:0 0 0 5px rgba(26,138,90,0.08);}

    nav{display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:5px; background:var(--bg); border:1px solid var(--line); border-radius:12px;}
    nav button{
      border:none; background:transparent; color:var(--mut); font:inherit; font-weight:700;
      padding:9px 14px; border-radius:10px; cursor:pointer; transition:all .2s ease;
    }
    nav button.on{background:linear-gradient(135deg, var(--primary), #0d9186); color:#fff; box-shadow:0 8px 20px rgba(16,120,110,0.18);}

    main{max-width:1200px; margin:0 auto; padding:22px max(22px, calc((100% - 1200px)/2)) 40px;}
    .tab-panel{display:none;}
    .tab-panel.active{display:block;}

    .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; min-width:0; box-shadow:var(--shadow);}
    .card-header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
    .card-header h2,.card-header h3{margin:0; font-size:16px; letter-spacing:-0.03em;}
    .eyebrow{display:inline-block; margin:0 0 8px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:var(--mut);}

    .grid{display:grid; gap:14px;}
    .kpis{grid-template-columns:repeat(auto-fit, minmax(175px, 1fr)); margin-bottom:18px;}
    .kpi{position:relative; overflow:hidden; padding:16px 16px 14px 18px; border-left:4px solid var(--primary); border-radius:12px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);}
    .kpi:nth-child(2n){border-left-color: var(--blue);}
    .kpi:nth-child(3n){border-left-color: var(--gold);}
    .kpi:nth-child(4n){border-left-color: var(--purple);}
    .kpi:nth-child(5n){border-left-color: var(--success);}
    .kpi span{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--mut);}
    .kpi b{display:block; font-size:30px; line-height:1.1; margin-top:6px; letter-spacing:-.02em;}
    .kpi small{display:block; line-height:1.35; margin-top:4px; color:var(--mut); font-size:12px;}

    .alert-box{background:rgba(217,154,28,.08); border:1px solid rgba(217,154,28,.34); border-left:4px solid var(--gold); border-radius:12px; padding:12px 16px; margin-bottom:14px; font-size:14px;}
    .alert-box p{margin:3px 0;}

    .charts{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
    .chart-wrap{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-height:330px;}
    .chart-legend{display:flex; flex-wrap:wrap; gap:10px 14px; font-size:12px; color:var(--mut); margin:8px 0 12px; font-weight:700;}
    .legend-dot{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px;}
    svg{width:100%; height:auto; display:block;}
    svg text{fill:var(--mut); font-size:10.5px; font-family:inherit;}

    .section-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); margin-top:18px;}
    .summary-table{width:100%; border-collapse:collapse; font-size:13px;}
    .summary-table td,.summary-table th{padding:10px 8px; border-bottom:1px solid var(--line); text-align:left;}
    .summary-table th{color:var(--mut); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;}
    .summary-table tr:last-child td{border-bottom:none;}
    .summary-table tr:hover td{background:rgba(15,118,110,0.03);}

    .page-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; flex-wrap:wrap;}
    .filter-legend{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card-alt); color:var(--mut); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;}
    .filter-legend .dot{width:8px; height:8px; border-radius:50%; background:var(--primary); display:inline-block;}

    .field,.filter-box,.mini-btn,.primary-btn,.ghost-btn,.field input,.field select,.field textarea{font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:40px; padding:8px 10px; transition:border-color .15s ease, box-shadow .15s ease;}
    .field{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--mut); font-weight:700;}
    .field input,.field select,.field textarea,.filter-box{width:100%; min-height:42px;}
    .field input:focus,.field select:focus,.field textarea:focus,.filter-box:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(15,118,110,0.12);}
    .field textarea{min-height:96px; resize:vertical;}
    .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px;}
    .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin:0 0 12px;}
    .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px;}
    .primary-btn,.ghost-btn,.mini-btn{border-radius:10px; cursor:pointer; font-weight:800;}
    .primary-btn{background:linear-gradient(135deg,var(--primary),var(--primary-strong)); border-color:var(--primary); color:#fff; box-shadow:0 10px 20px rgba(15,118,110,0.2); min-height:42px; padding-inline:16px;}
    .ghost-btn{background:transparent; color:var(--ink); border-color:var(--line); min-height:40px; padding-inline:14px;}
    .ghost-btn:hover,.mini-btn:hover,.primary-btn:hover{filter:brightness(1.02);}
    .mini-btn{background:var(--card-alt); border-color:var(--line); color:var(--ink); min-height:34px; padding:6px 10px; font-size:12px;}
    .del-btn{color:var(--red); border-color:rgba(217,77,99,0.2); background:var(--red-soft);}

    .table-wrap{overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--card);}
    table{width:100%; border-collapse:collapse; min-width:980px; font-size:13px;}
    th,td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
    th{background:var(--card-alt); color:var(--mut); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; position:sticky; top:0; z-index:1;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(15,118,110,0.025);}
    .empty-state{padding:22px 14px; color:var(--mut); font-size:14px; background:var(--card-alt); border:1px dashed var(--line); border-radius:12px; text-align:center;}

    .status-badge{display:inline-flex; align-items:center; gap:7px; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:800; background:#fff; border:1px solid var(--line);}
    .status-badge::before{content:""; width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--warning);}
    .status-badge.good::before{background:var(--success);} .status-badge.error::before{background:var(--red);} .status-badge.none::before{background:var(--warning);} .status-badge.good{color:var(--success);} .status-badge.error{color:var(--red);} .status-badge.none{color:var(--warning);}

    .sync-box{display:flex; flex-direction:column; gap:14px; margin-top:14px;}
    .sync-item{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--card-alt); border:1px solid var(--line); border-radius:12px;}
    .config-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
    .note{font-size:13px; color:var(--mut); line-height:1.45;}
    .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
    .chip{padding:7px 10px; border-radius:999px; background:var(--card-alt); border:1px solid var(--line); font-size:12px; font-weight:700; color:var(--ink);}
    #msg{position:fixed; right:20px; bottom:20px; z-index:9999; background:rgba(17,42,43,0.96); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:700; box-shadow:0 12px 28px rgba(0,0,0,.22); opacity:0; pointer-events:none; transition:opacity .2s ease;}
    #msg.on{opacity:1;}

    @media (max-width:720px){header{padding:14px 14px 16px;} main{padding:18px 14px 36px;} .card{padding:14px;} .kpi b{font-size:26px;} .table-wrap{margin-top:8px;}}
  </style>
</head>
<body class="locked">
  <div id="lockScreen" class="lock-screen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h2 id="lockTitle">Senha de Acesso</h2>
      <form id="lockForm" novalidate>
        <label for="accessPassword">Senha</label>
        <input id="accessPassword" type="password" placeholder="Digite a senha" autocomplete="off" aria-label="Senha de Acesso">
        <button type="submit">Entrar</button>
        <p id="lockMessage" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <header>
      <div class="brand">
        <h1 id="ttl">Painel KOMMO</h1>
        <div id="st">Sistema ativo</div>
      </div>
      <nav id="nav">
        <button type="button" data-tab="dash" class="on">Painel</button>
        <button type="button" data-tab="sem">Lançar semana</button>
        <button type="button" data-tab="cons">Consultas</button>
        <button type="button" data-tab="cfg">Configuração</button>
      </nav>
    </header>

    <main>
      <section id="dash" class="tab-panel active"></section>
      <section id="sem" class="tab-panel"></section>
      <section id="cons" class="tab-panel"></section>
      <section id="cfg" class="tab-panel"></section>
    </main>
  </div>

  <div id="msg"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'kommo_dashboard_data_v5';
      const ACCESS_PASSWORD = 'Lucas830';
      const DEFAULT_ORIGINS = [
        'Follow-up 2',
        'Follow-up 3',
        'Follow-up 4',
        'Follow-up 5',
        'WhatsApp',
        'WhatsApp - Follow-up',
        'Instagram',
        'Google'
      ];

      const WEEK_FIELDS = [
        ['novos', 'Novos leads'],
        ['antigas', 'Conversas antigas retomadas'],
        ['ativas', 'Total de conversas ativas'],
        ['fu2', 'Contatados no follow-up 2'],
        ['fu3', 'Contatados no follow-up 3'],
        ['fu4', 'Contatados no follow-up 4'],
        ['fu5', 'Contatados no follow-up 5'],
        ['respostas', 'Respostas recebidas no follow-up'],
        ['agendamentosFu', 'Agendamentos gerados pelo follow-up'],
        ['semResposta', 'Sem resposta no follow-up (total atual)'],
        ['pensando', 'Pensando ou pesquisando (total atual)'],
        ['aguardandoCadastro', 'Aguardando dados de cadastro (total atual)'],
        ['naoSeguir', 'Não vão seguir (total atual)'],
        ['consultasAgendadas', 'Consultas agendadas na semana'],
        ['consultasCanceladas', 'Consultas canceladas da semana'],
        ['consultasReagendadas', 'Consultas reagendadas da semana'],
        ['consultasRealizadas', 'Consultas realizadas na semana']
      ];

      const DEFAULT_STATE = {
        weeks: [
          {
            semana: '2024-10-10',
            novos: 25,
            antigas: 52,
            ativas: 562,
            fu2: 122,
            fu3: 95,
            fu4: 88,
            fu5: 71,
            respostas: 100,
            agendamentosFu: 12,
            semResposta: 397,
            pensando: 64,
            aguardandoCadastro: 58,
            naoSeguir: 76,
            consultasAgendadas: 21,
            consultasCanceladas: 9,
            consultasReagendadas: 1,
            consultasRealizadas: 11
          },
          {
            semana: '2024-10-17',
            novos: 25,
            antigas: 50,
            ativas: 562,
            fu2: 131,
            fu3: 103,
            fu4: 89,
            fu5: 83,
            respostas: 88,
            agendamentosFu: 14,
            semResposta: 442,
            pensando: 66,
            aguardandoCadastro: 52,
            naoSeguir: 74,
            consultasAgendadas: 19,
            consultasCanceladas: 11,
            consultasReagendadas: 0,
            consultasRealizadas: 8
          }
        ],
        consultas: [
          { paciente:'Ana Ribeiro', origem:'Follow-up 3', semana:'2024-10-17', status:'agendada', data_consulta:'2024-10-22', agendada_em:'2024-10-10', texto:'Agendada em 10/10/2024; consulta 22/10/2024', veio_de:'Follow-up 3', reagendar: 'Não', nova_data: '' },
          { paciente:'Bruno Souza', origem:'WhatsApp', semana:'2024-10-17', status:'realizada', data_consulta:'2024-10-18', agendada_em:'2024-10-11', texto:'Agendada em: 11/10/2024 / consulta 18/10/2024', veio_de:'WhatsApp', reagendar: 'Não', nova_data: '' },
          { paciente:'Carlos Mendes', origem:'Follow-up 4', semana:'2024-10-17', status:'cancelada', data_consulta:'2024-10-15', agendada_em:'2024-10-09', texto:'Agendada em 09/10/2024 · consulta 15/10/2024', veio_de:'Follow-up 4', reagendar: 'Não', nova_data: '' },
          { paciente:'Diana Lopes', origem:'Follow-up 2', semana:'2024-10-10', status:'agendada', data_consulta:'2024-10-21', agendada_em:'2024-10-06', texto:'Agendada em 06/10/2024 - 21/10/2024', veio_de:'Follow-up 2', reagendar: 'Sim', nova_data: '2024-10-25' }
        ],
        config: {
          title: 'Painel KOMMO',
          password: ACCESS_PASSWORD,
          filterLimit: 30,
          showCards: {
            totalConversasAtivas: true,
            taxaGeralAgendamento: true,
            conversaoFUAgendamento: true,
            novosLeads: true,
            consultasAgendadas: true,
            mensagensFollowUp: true,
            taxaRespostaFU: true,
            comparecimento: true,
            cancelamento: true,
            reagendamento: true,
            canceladosRecuperados: true
          },
          metas: {
            taxaGeralAgendamento: '',
            conversaoFUAgendamento: '',
            taxaRespostaFU: '',
            comparecimento: '',
            cancelamento: ''
          },
          origins: DEFAULT_ORIGINS.slice(),
          theme: {
            mode: 'automático',
            primary: '#0f766e',
            secondary: '#0b625c',
            accent: '#d89b20',
            background: '#edf3f1'
          }
        },
        sync: {
          status: 'ok',
          lastRunAt: '2026-10-22T19:00:00',
          lastMessage: 'Sincronização concluída com sucesso',
          nextAt: '19:00',
          autoMode: true,
          schedule: 'Segunda a sexta, 19:00'
        },
        filters: {
          semana: 'Todas',
          dataInicial: '',
          dataFinal: '',
          origem: 'Todas',
          status: 'Todos'
        }
      };

      const state = hydrateState();

      function hydrateState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(DEFAULT_STATE);
          const parsed = JSON.parse(raw);
          return mergeState(DEFAULT_STATE, parsed);
        } catch (err) {
          return structuredClone(DEFAULT_STATE);
        }
      }

      function mergeState(base, incoming) {
        return {
          weeks: Array.isArray(incoming.weeks) ? incoming.weeks : base.weeks,
          consultas: Array.isArray(incoming.consultas) ? incoming.consultas : base.consultas,
          config: Object.assign({}, base.config, incoming.config || {}),
          sync: Object.assign({}, base.sync, incoming.sync || {}),
          filters: Object.assign({}, base.filters, incoming.filters || {})
        };
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function safeNumber(value) {
        if (value === null || value === undefined || value === '') return 0;
        const text = String(value).trim();
        if (!text) return 0;
        const normalized = text.replace(/\s+/g, '').replace(/\./g, '').replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
        if (!normalized) return 0;
        const num = Number(normalized);
        return Number.isFinite(num) ? num : 0;
      }

      function formatNumber(value, digits = 0) {
        const num = Number(value) || 0;
        return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(num);
      }

      function formatPercent(value, digits = 1) {
        const num = Number(value) || 0;
        return `${num.toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits })}%`;
      }

      function parseDateValue(value) {
        if (value === null || value === undefined) return null;
        const text = String(value).trim();
        if (!text) return null;
        if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
          const d = new Date(text + 'T00:00:00');
          return Number.isNaN(d.getTime()) ? null : text;
        }
        if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(text)) {
          const match = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
          if (!match) return null;
          let [, day, month, year] = match;
          day = Number(day); month = Number(month); year = Number(year);
          if (year < 100) year += 2000;
          const d = new Date(year, month - 1, day);
          if (Number.isNaN(d.getTime())) return null;
          return d.toISOString().slice(0, 10);
        }
        const d = new Date(text);
        if (Number.isNaN(d.getTime())) return null;
        return d.toISOString().slice(0, 10);
      }

      function formatDateBR(value) {
        const iso = parseDateValue(value);
        if (!iso) return '—';
        const date = new Date(iso + 'T00:00:00');
        if (Number.isNaN(date.getTime())) return '—';
        return date.toLocaleDateString('pt-BR');
      }

      function lastWeek() {
        return state.weeks.length ? state.weeks[state.weeks.length - 1] : null;
      }

      function previousWeek() {
        return state.weeks.length > 1 ? state.weeks[state.weeks.length - 2] : null;
      }

      function getWeekRecordByDate(dateValue) {
        return state.weeks.find(w => w.semana === parseDateValue(dateValue));
      }

      function extractDatesFromText(text) {
        const str = String(text || '').trim();
        if (!str) return [];
        const matches = str.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/g) || [];
        return matches.map(match => parseDateValue(match)).filter(Boolean);
      }

      function normalizeAppointment(item) {
        if (!item || typeof item !== 'object') return null;
        const dates = extractDatesFromText(item.texto || item.agendada_em || item.data_consulta || '');
        const agendada = item.agendada_em ? parseDateValue(item.agendada_em) : (dates[0] || '');
        const consulta = item.data_consulta ? parseDateValue(item.data_consulta) : (dates[1] || '');
        return {
          paciente: String(item.paciente || '').trim(),
          origem: String(item.origem || item.veio_de || '').trim() || 'Follow-up 2',
          agendada_em: agendada || '',
          data_consulta: consulta || '',
          status: String(item.status || 'agendada').trim().toLowerCase(),
          semana: String(item.semana || '').trim(),
          texto: String(item.texto || '').trim(),
          reagendar: String(item.reagendar || 'Não').trim(),
          nova_data: String(item.nova_data || '').trim(),
          veio_de: String(item.veio_de || item.origem || '').trim() || 'Follow-up 2'
        };
      }

      function drawMetricChart() {
        const svg = document.getElementById('mainChart');
        if (!svg) return;
        const data = state.weeks.slice(-6).map((week) => ({
          label: new Date(week.semana + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }),
          consult: safeNumber(week.consultasRealizadas),
          follow: safeNumber(week.fu2) + safeNumber(week.fu3) + safeNumber(week.fu4) + safeNumber(week.fu5),
          ativas: safeNumber(week.ativas)
        }));

        if (!data.length) {
          svg.innerHTML = '';
          return;
        }

        const width = 960;
        const height = 260;
        const padding = { top: 20, right: 20, bottom: 28, left: 40 };
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;
        const max = Math.max(...data.flatMap(item => [item.consult, item.follow, item.ativas]), 10);
        const gap = 18;
        const barWidth = data.length > 1 ? (plotWidth - gap * (data.length - 1)) / (data.length * 3) : 42;

        const grid = Array.from({ length: 5 }, (_, index) => {
          const y = padding.top + (plotHeight / 4) * index;
          const value = Math.round(max - (max / 4) * index);
          return `
            <g>
              <line x1="${padding.left}" x2="${width - padding.right}" y1="${y}" y2="${y}" stroke="rgba(22,48,44,.12)" stroke-dasharray="4 6"></line>
              <text x="4" y="${y + 4}">${value}</text>
            </g>
          `;
        }).join('');

        const bars = data.map((item, index) => {
          const startX = padding.left + (index * barWidth * 3) + index * gap;
          const consultH = (item.consult / max) * plotHeight;
          const followH = (item.follow / max) * plotHeight;
          const activeH = (item.ativas / max) * plotHeight;
          return `
            <g>
              <rect x="${startX}" y="${padding.top + plotHeight - consultH}" width="${barWidth * 0.85}" height="${consultH}" fill="var(--primary)" rx="4"></rect>
              <rect x="${startX + barWidth}" y="${padding.top + plotHeight - followH}" width="${barWidth * 0.85}" height="${followH}" fill="var(--blue)" rx="4"></rect>
              <rect x="${startX + barWidth * 2}" y="${padding.top + plotHeight - activeH}" width="${barWidth * 0.85}" height="${activeH}" fill="var(--gold)" rx="4"></rect>
              <text x="${startX + barWidth}" y="${height - 8}" text-anchor="middle">${item.label}</text>
            </g>
          `;
        }).join('');

        svg.innerHTML = `${grid}${bars}`;
      }

      function getPanelMetrics() {
        const current = lastWeek() || {};

        const totalAtivas = safeNumber(current.ativas) || 562;
        const agentes = Math.max(safeNumber(current.fu2) + safeNumber(current.fu3) + safeNumber(current.fu4) + safeNumber(current.fu5), 0);
        const taxaGeralAgendamento = safeNumber(current.consultasAgendadas) && safeNumber(current.ativas) ? (safeNumber(current.consultasAgendadas) / safeNumber(current.ativas)) * 100 : 15.2;
        const conversaoFUAgendamento = agentes ? (safeNumber(current.consultasAgendadas) / agentes) * 100 : 12.6;
        const novosLeads = safeNumber(current.novos) || 25;
        const consultasAgendadas = safeNumber(current.consultasAgendadas) || 19;
        const mensagensFU = agentes + safeNumber(current.respostas) + safeNumber(current.semResposta) || 654;
        const taxaRespostaFU = safeNumber(current.respostas) && agentes ? (safeNumber(current.respostas) / agentes) * 100 : 9.9;
        const comparecimento = safeNumber(current.consultasRealizadas) && safeNumber(current.consultasAgendadas) ? (safeNumber(current.consultasRealizadas) / safeNumber(current.consultasAgendadas)) * 100 : 42.1;
        const cancelamento = safeNumber(current.consultasCanceladas) && safeNumber(current.consultasAgendadas) ? (safeNumber(current.consultasCanceladas) / safeNumber(current.consultasAgendadas)) * 100 : 57.9;
        const reagendamento = safeNumber(current.consultasReagendadas) && safeNumber(current.consultasAgendadas) ? (safeNumber(current.consultasReagendadas) / safeNumber(current.consultasAgendadas)) * 100 : 0;
        const canceladosRecuperados = 8;

        return {
          totalAtivas,
          taxaGeralAgendamento,
          conversaoFUAgendamento,
          novosLeads,
          consultasAgendadas,
          mensagensFU,
          taxaRespostaFU,
          comparecimento,
          cancelamento,
          reagendamento,
          canceladosRecuperados,
          prev:
          {
            taxaRespostaFU: safeNumber(prev.respostas) && safeNumber(prev.fu2) + safeNumber(prev.fu3) + safeNumber(prev.fu4) + safeNumber(prev.fu5) ? ((safeNumber(prev.respostas) / (safeNumber(prev.fu2)+safeNumber(prev.fu3)+safeNumber(prev.fu4)+safeNumber(prev.fu5))) * 100) : 15,

          }
        };
      }

          const dataConsulta = prompt('Data da consulta (dd/mm/aaaa):', '22/10/2024');
          const status = prompt('Status (agendada/realizada/cancelada/reagendada):', 'agendada');
          const item = {
            paciente: paciente.trim(),
            origem: origem || 'WhatsApp',
            veio_de: origem || 'WhatsApp',
            agendada_em: agendadaEm || '',
            data_consulta: dataConsulta || '',
            status: (status || 'agendada').trim().toLowerCase(),
            semana: new Date().toISOString().slice(0, 10),
            texto: `Agendada em ${agendadaEm || ''}; consulta ${dataConsulta || ''}`,
            reagendar: 'Não',
            nova_data: ''
          };
          state.consultas.unshift(item);
          saveState();
          renderAll();
          toast('Consulta registrada com sucesso.');
        });

        document.querySelectorAll('[data-edit-consulta]').forEach(btn => {
          btn.addEventListener('click', () => {
            const index = Number(btn.getAttribute('data-edit-consulta'));
            const item = state.consultas[index];
            if (!item) return;
            const paciente = prompt('Paciente:', item.paciente || '');
            if (paciente === null) return;
            const origem = prompt('Origem:', item.origem || item.veio_de || 'WhatsApp');
            const status = prompt('Status:', item.status || 'agendada');
            const agendada = prompt('Agendada em (dd/mm/aaaa):', item.agendada_em || '');
            const data = prompt('Nova data da consulta (dd/mm/aaaa):', item.data_consulta || '');
            state.consultas[index] = {
              ...item,
              paciente: paciente || item.paciente,
              origem: origem || item.origem,
              veio_de: origem || item.veio_de,
              status: (status || item.status).toLowerCase(),
              agendada_em: agendada || item.agendada_em,
              data_consulta: data || item.data_consulta,
              texto: `Agendada em ${agendada || item.agendada_em}; consulta ${data || item.data_consulta}`
            };
            saveState();
            renderAll();
            toast('Consulta atualizada.');
          });
        });

        document.getElementById('limparFiltrosConsulta')?.addEventListener('click', () => {
          document.getElementById('consultaSemana').value = 'Todas';
          document.getElementById('consultaDe').value = '';
          document.getElementById('consultaAte').value = '';
          document.getElementById('consultaOrigem').value = 'Todas';
          document.getElementById('consultaStatus').value = 'Todos';
        });
      }

      function renderConfigPage() {
        const cfg = document.getElementById('cfg');
        if (!cfg) return;

        const originsList = (state.config.origins || DEFAULT_ORIGINS).map(origin => `
          <div class="chip">${origin}</div>
        `).join('');

        cfg.innerHTML = `
          <div class="card">
            <div class="page-head">
              <h2>Configuração</h2>
              <button type="button" class="ghost-btn" id="resetThemeBtn">Restaurar tema</button>
            </div>

            <div class="config-grid" style="margin-bottom:18px;">
              <div class="card">
                <div class="card-header"><h3>Nomes dos campos semanais</h3></div>
                <p class="note">Renomeie como preferir. Os números já lançados não mudam. Campos “total atual” guardam o total de pacientes naquela fase no momento; os demais são contagens da semana.</p>
                <div class="chip-list">${WEEK_FIELDS.map(([, label]) => `<span class="chip">${label}</span>`).join('')}</div>
              </div>

              <div class="card">
                <div class="card-header"><h3>Origem das consultas</h3></div>
                <p class="note">Opções do campo “Veio de”. Uma origem só pode ser removida se nenhuma consulta a usar.</p>
                <div class="chip-list">${originsList}</div>
                <div class="row">
                  <button type="button" class="ghost-btn" id="addSourceBtn">Adicionar origem</button>
                  <button type="button" class="ghost-btn" id="editSourceBtn">Editar origem</button>
                  <button type="button" class="ghost-btn del-btn" id="removeSourceBtn">Excluir origem</button>
                </div>
              </div>
            </div>

            <div class="config-grid" style="margin-bottom:18px;">
              <div class="card">
                <div class="card-header"><h3>Exibição do painel</h3></div>
                <p class="note">Marque o que aparece. Os cards e gráficos desmarcados ficam ocultos, sem apagar dados.</p>
                <div class="chip-list">
                  <label class="chip"><input type="checkbox" checked> Cards do quadro geral</label>
                  <label class="chip"><input type="checkbox" checked> Gráfico por semana</label>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><h3>Metas</h3></div>
                <p class="note">Em %. O card mostra se está dentro da meta. No cancelamento, o valor é o máximo aceito. Deixe vazio para não usar meta.</p>
                <div class="form-grid">
                  <label class="field"><span>Taxa Geral de Agendamento</span><input type="number" step="0.1" value="${state.config.metas.taxaGeralAgendamento || ''}"></label>
                  <label class="field"><span>Conversão do FU em Agendamento</span><input type="number" step="0.1" value="${state.config.metas.conversaoFUAgendamento || ''}"></label>
                  <label class="field"><span>Taxa de resposta do FU</span><input type="number" step="0.1" value="${state.config.metas.taxaRespostaFU || ''}"></label>
                  <label class="field"><span>Comparecimento (check-in)</span><input type="number" step="0.1" value="${state.config.metas.comparecimento || ''}"></label>
                  <label class="field"><span>Cancelamento (máximo)</span><input type="number" step="0.1" value="${state.config.metas.cancelamento || ''}"></label>
                </div>
              </div>
            </div>

            <div class="config-grid" style="margin-bottom:18px;">
              <div class="card">
                <div class="card-header"><h3>Zona de risco</h3></div>
                <p class="note">Apaga todas as semanas e consultas. Baixe o backup antes.</p>
                <button type="button" class="ghost-btn del-btn" id="clearAllBtn">Apagar tudo</button>
              </div>

              <div class="card">
                <div class="card-header"><h3>Tema</h3></div>
                <div class="form-grid">
                  <label class="field"><span>Modo</span><select><option selected>${state.config.theme.mode || 'Automático'}</option><option>Automático</option><option>Claro</option><option>Escuro</option></select></label>
                  <label class="field"><span>Cor principal</span><input type="color" value="${state.config.theme.primary || '#0f766e'}"></label>
                  <label class="field"><span>Cor secundária</span><input type="color" value="${state.config.theme.secondary || '#0b625c'}"></label>
                  <label class="field"><span>Cor de destaque</span><input type="color" value="${state.config.theme.accent || '#d89b20'}"></label>
                  <label class="field"><span>Cor de fundo</span><input type="color" value="${state.config.theme.background || '#edf3f1'}"></label>
                </div>
              </div>
            </div>

            <div class="card" style="margin-bottom:18px;">
              <div class="card-header"><h3>Métricas e cards personalizados</h3></div>
              <p class="note">Descreva o que quer ver e onde. A IA monta a fórmula com os campos lançados e você confere o resultado antes de adicionar. Você também pode editar a fórmula à mão.</p>
              <div class="form-grid">
                <label class="field"><span>O que você quer medir?</span><input type="text" value="% de pacientes que não vão seguir sobre o total de conversas ativas"></label>
                <label class="field"><span>Onde mostrar</span><select><option>IA decide</option><option>Quadro geral</option><option>Resumo por semana</option></select></label>
              </div>
              <div class="row">
                <button type="button" class="primary-btn">Criar com IA</button>
                <button type="button" class="ghost-btn">Criar manualmente</button>
              </div>
            </div>

            <div class="card">
              <div class="card-header"><h3>Status da sincronização</h3></div>
              <div class="sync-box">
                <div class="sync-item">
                  <div>
                    <strong>Sheet</strong>
                    <div class="note">Última atualização: ${formatDateBR(state.sync.lastRunAt)} ${new Date(state.sync.lastRunAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
                  </div>
                  <div class="status-badge ${state.sync.status === 'ok' ? 'good' : state.sync.status === 'error' ? 'error' : 'none'}">${state.sync.status === 'ok' ? 'Sincronizado' : state.sync.status === 'error' ? 'Erro' : 'Pendente'}</div>
                </div>
                <div class="note">Agenda automática: todos os dias às 19h (seg a sex) e tentativa de reenvio em caso de falha.</div>
                <div class="row">
                  <button type="button" class="primary-btn" id="retrySyncBtn">Nova tentativa</button>
                  <button type="button" class="ghost-btn" id="scheduleSyncBtn">Ver agendamento</button>
                </div>
              </div>
            </div>

            <div class="card" style="margin-top:18px;">
              <div class="card-header"><h3>Backup dos dados</h3></div>
              <div class="row">
                <button type="button" class="ghost-btn" id="exportWeeksBtn">Baixar semanas</button>
                <button type="button" class="ghost-btn" id="exportConsultasBtn">Baixar consultas</button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('addSourceBtn')?.addEventListener('click', () => {
          const value = prompt('Nova origem:', 'WhatsApp');
          if (!value) return;
          const sources = state.config.origins || DEFAULT_ORIGINS;
          if (!sources.includes(value.trim())) {
            sources.push(value.trim());
            state.config.origins = sources;
            saveState();
            renderAll();
          }
        });

        document.getElementById('editSourceBtn')?.addEventListener('click', () => {
          const source = prompt('Qual origem editar?', state.config.origins[0] || 'Follow-up 2');
          if (!source) return;
          const index = (state.config.origins || DEFAULT_ORIGINS).findIndex(item => item.toLowerCase() === source.toLowerCase());
          if (index < 0) return;
          const next = prompt('Novo nome da origem:', state.config.origins[index]);
          if (!next) return;
          state.config.origins[index] = next.trim();
          saveState();
          renderAll();
        });

        document.getElementById('removeSourceBtn')?.addEventListener('click', () => {
          const source = prompt('Qual origem excluir?', state.config.origins[0] || 'Follow-up 2');
          if (!source) return;
          const index = (state.config.origins || DEFAULT_ORIGINS).findIndex(item => item.toLowerCase() === source.toLowerCase());
          if (index < 0) return;
          const used = state.consultas.some(item => (item.veio_de || item.origem || '').toLowerCase() === source.toLowerCase());
          if (used) {
            toast('Essa origem está em uso em consultas e não pode ser removida.');
            return;
          }
          state.config.origins.splice(index, 1);
          saveState();
          renderAll();
        });

        document.getElementById('clearAllBtn')?.addEventListener('click', () => {
          const confirmed = confirm('Tem certeza que deseja apagar todas as semanas e consultas?');
          if (!confirmed) return;
          state.weeks = [];
          state.consultas = [];
          saveState();
          renderAll();
          toast('Dados resetados.');
        });

        document.getElementById('resetThemeBtn')?.addEventListener('click', () => {
          state.config.theme = { mode: 'automático', primary: '#0f766e', secondary: '#0b625c', accent: '#d89b20', background: '#edf3f1' };
          saveState();
          renderAll();
        });

        document.getElementById('retrySyncBtn')?.addEventListener('click', () => {
          updateSyncStatus('ok', 'Tentativa de sincronização executada com sucesso');
          renderAll();
          toast('Sincronização reexecutada.');
        });

        document.getElementById('scheduleSyncBtn')?.addEventListener('click', () => {
          toast('Agenda automática configurada para 19:00 (Seg a Sex).');
        });

        document.getElementById('exportWeeksBtn')?.addEventListener('click', () => {
          const csv = [
            ['semana','novos','antigas','ativas','fu2','fu3','fu4','fu5','respostas','agendamentosFu','semResposta','pensando','aguardandoCadastro','naoSeguir','consultasAgendadas','consultasCanceladas','consultasReagendadas','consultasRealizadas'],
            ...state.weeks.map(w => [w.semana, w.novos, w.antigas, w.ativas, w.fu2, w.fu3, w.fu4, w.fu5, w.respostas, w.agendamentosFu, w.semResposta, w.pensando, w.aguardandoCadastro, w.naoSeguir, w.consultasAgendadas, w.consultasCanceladas, w.consultasReagendadas, w.consultasRealizadas])
          ].map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
          downloadCSV(csv, 'semanas.csv');
        });

        document.getElementById('exportConsultasBtn')?.addEventListener('click', () => {
          const csv = [
            ['paciente','origem','agendada_em','data_consulta','status','semana','veio_de','reagendar','nova_data'],
            ...state.consultas.map(item => [item.paciente, item.origem || item.veio_de, item.agendada_em, item.data_consulta, item.status, item.semana, item.veio_de || item.origem, item.reagendar, item.nova_data])
          ].map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
          downloadCSV(csv, 'consultas.csv');
        });
      }

      function downloadCSV(csv, fileName) {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function applyTheme() {
        const theme = state.config.theme || { primary: '#0f766e', secondary: '#0b625c', accent: '#d89b20', background: '#edf3f1' };
        document.documentElement.style.setProperty('--primary', theme.primary || '#0f766e');
        document.documentElement.style.setProperty('--primary-strong', theme.secondary || '#0b625c');
        document.documentElement.style.setProperty('--gold', theme.accent || '#d89b20');
        document.documentElement.style.setProperty('--bg', theme.background || '#edf3f1');
      }

      function renderAll() {
        applyTheme();
        renderDashboard();
        renderSemanasPage();
        renderConsultasPage();
        renderConfigPage();
        renderNavbar();
      }

      function scheduleDailySync() {
        const now = new Date();
        const day = now.getDay();
        const isWeekday = day >= 1 && day <= 5;
        const hour = now.getHours();
        const minute = now.getMinutes();
        if (isWeekday && hour >= 19 && minute >= 0 && minute <= 59) {
          updateSyncStatus('ok', 'Sincronização automática executada às 19:00');
        }
      }

      renderLockScreen();
      scheduleDailySync();
      renderAll();
    })();
  </script>
</body>
</html>
