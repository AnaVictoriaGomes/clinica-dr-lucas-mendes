<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel KOMMO – Follow-up e Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#edf3f1;
      --bg-strong:#e1ece8;
      --card:#ffffff;
      --card-alt:#f7faf9;
      --ink:#122a2b;
      --mut:#5b726d;
      --line:#dfe9e4;
      --primary:#0f766e;
      --primary-strong:#0b625c;
      --primary-soft:#dcf8f3;
      --gold:#d89b20;
      --gold-soft:#fff4d8;
      --blue:#2c5e9a;
      --blue-soft:#edf4ff;
      --purple:#6f5ab3;
      --purple-soft:#f1ebff;
      --red:#d84f62;
      --red-soft:#ffe8ee;
      --success:#1a8a5a;
      --success-soft:#ebfbf1;
      --warning:#c78112;
      --warning-soft:#fff4d8;
      --shadow:0 12px 30px rgba(16, 35, 32, 0.08), 0 2px 10px rgba(16, 35, 32, 0.04);
      --radius:18px;
      color-scheme:light;
      box-sizing:border-box;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      background:linear-gradient(180deg, #edf3f1 0%, #edf5f3 100%);
      color:var(--ink);
      font:15px/1.5 "Figtree", system-ui, sans-serif;
      overflow-x:hidden;
    }
    body.locked { overflow:hidden; }
    .app-shell { display:none; }
    body:not(.locked) .app-shell { display:block; }

    .lock-screen {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at top, #f5faf8 0%, #e8f0ee 38%, #dfeae6 100%);
      z-index:2000;
    }
    body:not(.locked) .lock-screen { display:none; }

    .lock-card {
      width:min(92vw, 400px);
      background:rgba(255,255,255,0.97);
      border:1px solid rgba(17,43,43,0.08);
      border-radius:26px;
      padding:30px 24px 22px;
      box-shadow:0 32px 80px rgba(14, 36, 32, 0.15);
      text-align:center;
    }
    .lock-icon { font-size:46px; margin-bottom:8px; }
    .lock-card h2 {
      margin:0 0 14px;
      font-size:28px;
      letter-spacing:-0.04em;
      color:var(--ink);
    }
    .lock-card label {
      display:block;
      text-align:left;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:var(--mut);
      margin:12px 0 8px;
    }
    .lock-card input {
      width:100%;
      min-height:52px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 14px;
      background:#fff;
      color:var(--ink);
      font:inherit;
    }
    .lock-card input:focus {
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(15,118,110,0.12);
    }
    .lock-card button {
      width:100%;
      min-height:50px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      color:#fff;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      margin-top:10px;
      box-shadow:0 16px 30px rgba(15,118,110,0.22);
    }
    .lock-card button:hover { filter:brightness(1.03); }
    #lockMessage {
      min-height:18px;
      margin:12px 0 0;
      color:var(--red);
      font-weight:700;
      font-size:14px;
    }

    header {
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:16px max(22px, calc((100% - 1200px)/2));
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }
    .brand { display:flex; flex-direction:column; gap:2px; }
    .brand h1 {
      margin:0;
      font-size:20px;
      letter-spacing:-0.04em;
    }
    #st {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:2px;
      font-size:12px;
      font-weight:700;
      color:var(--mut);
    }
    #st::before {
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--success);
      display:inline-block;
      box-shadow:0 0 0 5px rgba(26,138,90,0.08);
    }

    nav {
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:6px;
      padding:5px;
      background:var(--bg);
      border:1px solid var(--line);
      border-radius:12px;
    }
    nav button {
      border:none;
      background:transparent;
      color:var(--mut);
      font:inherit;
      font-weight:700;
      padding:9px 14px;
      border-radius:10px;
      cursor:pointer;
      transition:all .2s ease;
    }
    nav button.on {
      background:linear-gradient(135deg, var(--primary), #0d9186);
      color:#fff;
      box-shadow:0 8px 20px rgba(16,120,110,0.18);
    }

    main {
      max-width:1200px;
      margin:0 auto;
      padding:22px max(22px, calc((100% - 1200px)/2)) 40px;
    }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
      min-width:0;
    }
    .card-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .card-header h2,
    .card-header h3 {
      margin:0;
      font-size:16px;
      letter-spacing:-0.03em;
    }
    .eyebrow {
      display:inline-block;
      margin:0 0 8px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:var(--mut);
    }
    .hero {
      margin-bottom:18px;
    }
    .hero-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }
    .hero-head h2 {
      margin:0;
      font-size:28px;
      letter-spacing:-0.05em;
    }
    .status-pill {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--card-alt);
      font-size:12px;
      font-weight:700;
      color:var(--mut);
    }
    .status-pill::before {
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--warning);
      display:inline-block;
    }
    .status-pill.good::before { background:var(--success); }
    .status-pill.error::before { background:var(--red); }
    .status-pill.none::before { background:var(--warning); }

    .kpi-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:14px;
    }
    .kpi {
      position:relative;
      overflow:hidden;
      padding:16px 16px 14px 18px;
      border-radius:16px;
      background:var(--card);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-left-width:4px;
      border-left-style:solid;
    }
    .kpi:nth-child(1) { border-left-color:var(--primary); }
    .kpi:nth-child(2) { border-left-color:var(--blue); }
    .kpi:nth-child(3) { border-left-color:var(--gold); }
    .kpi:nth-child(4) { border-left-color:var(--purple); }
    .kpi-label {
      display:block;
      font-size:11px;
      font-weight:800;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--mut);
    }
    .kpi-value {
      display:block;
      margin-top:10px;
      font-size:30px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:-0.05em;
      color:var(--ink);
    }
    .kpi-meta {
      display:block;
      margin-top:6px;
      font-size:12px;
      color:var(--mut);
    }

    .insight {
      margin-top:18px;
      padding:14px 16px;
      background:linear-gradient(135deg, var(--gold-soft), #fffdf4);
      border:1px solid rgba(216,155,32,0.35);
      border-left:4px solid var(--gold);
      border-radius:16px;
      color:var(--ink);
    }
    .insight strong { font-weight:800; }

    .summary-table {
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    .summary-table td, .summary-table th {
      padding:10px 8px;
      border-bottom:1px solid var(--line);
      text-align:left;
    }
    .summary-table th {
      color:var(--mut);
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
    }
    .summary-table tr:last-child td { border-bottom:none; }
    .summary-table tr:hover td { background:rgba(15,118,110,0.03); }

    .section-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:18px;
      margin-top:18px;
    }
    .chart-wrap {
      background:linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      min-height:330px;
    }
    .chart-legend {
      display:flex;
      flex-wrap:wrap;
      gap:12px 16px;
      margin:12px 0 16px;
      font-size:12px;
      color:var(--mut);
      font-weight:700;
    }
    .legend-dot {
      display:inline-block;
      width:10px;
      height:10px;
      border-radius:3px;
      margin-right:6px;
      vertical-align:-1px;
    }
    svg { display:block; width:100%; height:auto; }
    svg text { fill:var(--mut); font-size:10.5px; font-family:inherit; }

    .field,
    .filter-box,
    .inline-input,
    .mini-btn,
    .primary-btn,
    .ghost-btn,
    .field input,
    .field select,
    .field textarea {
      font:inherit;
      color:var(--ink);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      min-height:40px;
      padding:8px 10px;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    .field {
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:12px;
      color:var(--mut);
      font-weight:700;
    }
    .field input,
    .field select,
    .field textarea,
    .filter-box,
    .inline-input {
      width:100%;
      min-height:42px;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus,
    .filter-box:focus,
    .inline-input:focus {
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(15,118,110,0.12);
    }
    .field textarea { min-height:96px; resize:vertical; }

    .form-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
      gap:12px;
    }
    .row {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      margin-top:16px;
    }
    .toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:end;
      margin:0 0 12px;
    }
    .primary-btn,
    .ghost-btn,
    .mini-btn {
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
    }
    .primary-btn {
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      border-color:var(--primary);
      color:#fff;
      box-shadow:0 10px 20px rgba(15,118,110,0.2);
      min-height:42px;
      padding-inline:16px;
    }
    .ghost-btn {
      background:transparent;
      color:var(--ink);
      border-color:var(--line);
      min-height:40px;
      padding-inline:14px;
    }
    .ghost-btn:hover,
    .mini-btn:hover,
    .primary-btn:hover { filter:brightness(1.02); }
    .mini-btn {
      background:var(--card-alt);
      border-color:var(--line);
      color:var(--ink);
      min-height:34px;
      padding:6px 10px;
      font-size:12px;
    }
    .del-btn {
      color:var(--red);
      border-color:rgba(217,77,99,0.2);
      background:var(--red-soft);
    }

    .table-wrap {
      overflow:auto;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--card);
    }
    table {
      width:100%;
      border-collapse:collapse;
      min-width:760px;
      font-size:13px;
    }
    th, td {
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      white-space:nowrap;
      vertical-align:middle;
    }
    th {
      background:var(--card-alt);
      color:var(--mut);
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
      position:sticky;
      top:0;
      z-index:1;
    }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(15,118,110,0.025); }
    .empty-state {
      padding:22px 14px;
      color:var(--mut);
      font-size:14px;
      background:var(--card-alt);
      border:1px dashed var(--line);
      border-radius:12px;
      text-align:center;
    }

    .sync-box {
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:14px 0 0;
    }
    .sync-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      background:var(--card-alt);
      border:1px solid var(--line);
      border-radius:12px;
    }
    .sync-status {
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      background:#fff;
      border:1px solid var(--line);
    }
    .sync-status::before {
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      display:inline-block;
      background:var(--warning);
    }
    .sync-status.good::before { background:var(--success); }
    .sync-status.error::before { background:var(--red); }
    .sync-status.none::before { background:var(--warning); }
    .sync-status.good { color:var(--success); }
    .sync-status.error { color:var(--red); }
    .sync-status.none { color:var(--warning); }

    .config-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:12px;
    }
    .note {
      font-size:13px;
      color:var(--mut);
      line-height:1.45;
    }
    #msg {
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:9999;
      background:rgba(17,42,43,0.96);
      color:#fff;
      padding:10px 16px;
      border-radius:10px;
      font-size:13px;
      font-weight:700;
      box-shadow:0 12px 28px rgba(0,0,0,.22);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
    }
    #msg.on { opacity:1; }

    @media (max-width:720px) {
      header {
        padding:14px 14px 16px;
      }
      main { padding:18px 14px 36px; }
      .card { padding:14px; }
      .hero-head h2 { font-size:24px; }
      .kpi-value { font-size:26px; }
      .table-wrap { margin-top:8px; }
    }
  </style>
</head>
<body class="locked">
  <div id="lockScreen" class="lock-screen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h2 id="lockTitle">Senha de Acesso</h2>
      <form id="lockForm" novalidate>
        <label for="accessPassword">Senha</label>
        <input id="accessPassword" type="password" placeholder="Digite a senha" autocomplete="off" aria-label="Senha de Acesso">
        <button type="submit">Entrar</button>
        <p id="lockMessage" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <header>
      <div class="brand">
        <h1 id="ttl">Painel KOMMO</h1>
        <div id="st">Sistema ativo</div>
      </div>
      <nav id="nav">
        <button type="button" data-tab="dash" class="on">Painel</button>
        <button type="button" data-tab="sem">Lançar semana</button>
        <button type="button" data-tab="cons">Consultas</button>
        <button type="button" data-tab="cfg">Configuração</button>
      </nav>
    </header>

    <main>
      <section id="dash" class="tab-panel active"></section>
      <section id="sem" class="tab-panel"></section>
      <section id="cons" class="tab-panel"></section>
      <section id="cfg" class="tab-panel"></section>
    </main>
  </div>

  <div id="msg"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'kommo_dashboard_data_v2';
      const ACCESS_PASSWORD = 'Lucas830';
      const SHEETDB_WEEK_URL = 'https://sheetdb.io/api/v1/hd148z3uhn04n';
      const SHEETDB_CONSULTA_URL = 'https://sheetdb.io/api/v1/antynpy96prfl';
      const FIELDS = [
        ['novos','Novos leads'],
        ['antigas','Conversas antigas retomadas'],
        ['ativas','Total de conversas ativas'],
        ['fu2','Follow-up 2'],
        ['fu3','Follow-up 3'],
        ['fu4','Follow-up 4'],
        ['fu5','Follow-up 5'],
        ['resp','Respostas'],
        ['m1','Mensagens 1'],
        ['m2','Mensagens 2'],
        ['m3','Mensagens 3'],
        ['m4','Mensagens 4'],
        ['m5','Mensagens 5'],
        ['m6','Mensagens 6'],
        ['cagend','Consultas agendadas'],
        ['tcap','Total atual']
      ];

      const state = {
        weeks: {},
        appts: [],
        cfg: { title: 'Painel KOMMO', password: ACCESS_PASSWORD, filterLimit: 30 },
        sync: { weeks: 'none', appointments: 'none' }
      };

      function safeNumber(value) {
        if (value === null || value === undefined || value === '') return 0;
        const text = String(value).trim();
        if (!text) return 0;
        const normalized = text
          .replace(/\s+/g, '')
          .replace(/\./g, '')
          .replace(/,/g, '.')
          .replace(/[^0-9.\-]/g, '');
        if (!normalized) return 0;
        const n = Number(normalized);
        return Number.isFinite(n) ? n : 0;
      }

      function parseDateValue(rawValue) {
        if (rawValue === null || rawValue === undefined) return null;
        const value = String(rawValue).trim();
        if (!value) return null;

        if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
          const date = new Date(value + 'T00:00:00');
          return Number.isNaN(date.getTime()) ? null : value;
        }

        if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(value)) {
          const match = value.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
          if (!match) return null;
          let [, day, month, year] = match;
          day = Number(day);
          month = Number(month);
          year = Number(year);
          if (year < 100) year += 2000;
          const date = new Date(year, month - 1, day);
          if (Number.isNaN(date.getTime())) return null;
          return date.toISOString().slice(0, 10);
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return null;
        return date.toISOString().slice(0, 10);
      }

      function formatDateBR(value) {
        const iso = parseDateValue(value);
        if (!iso) return '—';
        const date = new Date(iso + 'T00:00:00');
        if (Number.isNaN(date.getTime())) return '—';
        return date.toLocaleDateString('pt-BR');
      }

      function formatNumber(value, digits = 0) {
        const number = Number(value) || 0;
        return new Intl.NumberFormat('pt-BR', {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        }).format(number);
      }

      function normalizeWeekRecord(record) {
        const out = {};
        FIELDS.forEach(([key]) => {
          out[key] = safeNumber(record && record[key]);
        });
        return out;
      }

      function normalizeWeeksMap(rawWeeks) {
        const entries = {};
        if (!rawWeeks || typeof rawWeeks !== 'object') return entries;
        Object.keys(rawWeeks).forEach(key => {
          const iso = parseDateValue(key);
          if (!iso) return;
          entries[iso] = normalizeWeekRecord(rawWeeks[key]);
        });
        return entries;
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { weeks: {}, appts: [], cfg: { ...state.cfg }, sync: { ...state.sync } };
          const parsed = JSON.parse(raw);
          return {
            weeks: normalizeWeeksMap(parsed && parsed.weeks ? parsed.weeks : {}),
            appts: Array.isArray(parsed && parsed.appts) ? parsed.appts : [],
            cfg: parsed && parsed.cfg ? { ...state.cfg, ...parsed.cfg } : { ...state.cfg },
            sync: parsed && parsed.sync ? { ...state.sync, ...parsed.sync } : { ...state.sync }
          };
        } catch (error) {
          console.error('Erro ao ler localStorage:', error);
          return { weeks: {}, appts: [], cfg: { ...state.cfg }, sync: { ...state.sync } };
        }
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          weeks: state.weeks,
          appts: state.appts,
          cfg: state.cfg,
          sync: state.sync
        }));
      }

      function toast(message) {
        const el = document.getElementById('msg');
        if (!el) return;
        el.textContent = message;
        el.classList.add('on');
        clearTimeout(toast.timer);

      function drawWeeklyChart() {
        const svg = document.getElementById('mainChart');
        if (!svg) return;

        const weeks = getAllWeeksSorted();
        if (!weeks.length) {
          svg.innerHTML = '';
          return;
        }

        const width = 960;
        const height = 260;
        const padding = { top: 20, right: 20, bottom: 34, left: 46 };
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;

        const values = weeks.map(date => {
          const item = state.weeks[date] || {};
          return [
            safeNumber(item.ativas),
            safeNumber(item.fu2) + safeNumber(item.fu3) + safeNumber(item.fu4) + safeNumber(item.fu5),
            safeNumber(item.resp)
          ];
        });

        const maxValue = Math.max(...values.flat(), 10);
        const gap = 24;
        const barWidth = (plotWidth - gap * (weeks.length - 1)) / (weeks.length * 3);

        const grid = Array.from({ length: 5 }, (_, index) => {
          const y = padding.top + (plotHeight / 4) * index;
          const value = Math.round(maxValue - (maxValue / 4) * index);
          return `
            <g>
              <line x1="${padding.left}" x2="${width - padding.right}" y1="${y}" y2="${y}" stroke="rgba(17,43,43,.10)" stroke-dasharray="5 7"></line>
              <text x="6" y="${y + 4}">${value}</text>
            </g>
          `;
        }).join('');

        const bars = weeks.map((date, index) => {
          const item = state.weeks[date] || {};
          const ativas = safeNumber(item.ativas);
          const follow = safeNumber(item.fu2) + safeNumber(item.fu3) + safeNumber(item.fu4) + safeNumber(item.fu5);
          const resp = safeNumber(item.resp);
          const startX = padding.left + (index * barWidth * 3) + index * gap;

          const hAtivas = (ativas / maxValue) * plotHeight;
          const hFollow = (follow / maxValue) * plotHeight;
          const hResp = (resp / maxValue) * plotHeight;
          const label = new Date(date + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

          return `
            <g>
              <rect x="${startX}" y="${padding.top + plotHeight - hAtivas}" width="${barWidth * 0.82}" height="${hAtivas}" fill="var(--primary)" rx="5"></rect>
              <rect x="${startX + barWidth}" y="${padding.top + plotHeight - hFollow}" width="${barWidth * 0.82}" height="${hFollow}" fill="var(--blue)" rx="5"></rect>
              <rect x="${startX + barWidth * 2}" y="${padding.top + plotHeight - hResp}" width="${barWidth * 0.82}" height="${hResp}" fill="var(--gold)" rx="5"></rect>
              <text x="${startX + barWidth}" y="${height - 10}" text-anchor="middle">${label}</text>
            </g>
          `;
        }).join('');

        svg.innerHTML = `${grid}${bars}`;
      }

        const payload = readWeekForm();
        state.weeks[normalizedDate] = payload;

      function copyPreviousWeek() {
        const dates = getAllWeeksSorted();
        if (!dates.length) {
          toast('Nenhuma semana anterior para copiar.');
          return;

        const prevDate = dates[dates.length - 1];
        const source = state.weeks[prevDate];
        if (!source) {
          toast('Semana anterior inválida.');
          return;
        }

        const currentDate = document.getElementById('wd')?.value || prevDate;
        const normalized = parseDateValue(currentDate) || prevDate;
        const wd = document.getElementById('wd');
        if (wd) wd.value = normalized;
        populateWeekFields(source);
        toast('Valores copiados da semana anterior.');

      function importFromPaste() {
        const text = document.getElementById('paste')?.value.trim();
        if (!text) {
          toast('Cole os dados da planilha para importar.');
          return;
        }

        const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
        let imported = 0;

        lines.forEach(line => {
          const cells = line.split(/\t|\s{2,}|\s*;\s*/).map(item => item.trim()).filter(Boolean);
          if (!cells.length) return;
          const [first, ...rest] = cells;
          const date = parseDateValue(first);
          if (!date) return;
          const entry = { data_semana: date };
          FIELDS.forEach(([key], index) => {
            entry[key] = safeNumber(rest[index] || 0);
          });
          state.weeks[date] = normalizeWeekRecord(entry);
          imported += 1;
        });

        if (!imported) {
          toast('Nenhuma linha válida foi encontrada.');
          return;
        }

        saveData();
        renderAll();
        document.getElementById('paste').value = '';
        toast('Dados importados com sucesso.');
      }

      function addAppointment() {
        const nome = document.getElementById('cp_n')?.value.trim();
        const origem = document.getElementById('cp_o')?.value || 'Instagram';
        const marcada = document.getElementById('cp_s')?.value || '';
        const consulta = document.getElementById('cp_c')?.value || '';

        if (!nome || !consulta) {
          toast('Preencha paciente e data da consulta.');
          return;
        }

        const item = {
          paciente: nome,
          origem,
          agendada_em: parseDateValue(marcada) || marcada,
          data_consulta: parseDateValue(consulta) || consulta,
          status: 'agendada'
        };

        state.appts.push(item);
        saveData();
        renderConsultsTab();
        renderDashboard();

        document.getElementById('cp_n').value = '';
        document.getElementById('cp_o').value = 'Instagram';
        document.getElementById('cp_s').value = new Date().toISOString().slice(0, 10);
        document.getElementById('cp_c').value = '';

        syncAppointmentsToSheetDB(item);
        toast('Consulta adicionada com sucesso.');
      }

      function importAppointments() {
        const text = document.getElementById('cp_paste')?.value.trim();
        if (!text) {
          toast('Cole os dados do paciente para importar.');
          return;
        }

        const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
        let imported = 0;

        lines.forEach(line => {
          const parts = line.split(/\s*\/\s*|\s*;\s*|\t+/).map(part => part.trim()).filter(Boolean);
          if (parts.length < 4) return;
          const [paciente, origem, agendada, consulta] = parts;
          const item = {
            paciente: paciente || 'Paciente',
            origem: origem || 'Instagram',
            agendada_em: parseDateValue(agendada) || agendada,
            data_consulta: parseDateValue(consulta) || consulta,
            status: 'agendada'
          };
          state.appts.push(item);
          imported += 1;
        });

        if (!imported) {
          toast('Nenhum registro válido foi encontrado.');
          return;
        }

        saveData();
        renderConsultsTab();
        document.getElementById('cp_paste').value = '';
        toast('Consultas importadas com sucesso.');
      }

      function updateAppointmentStatus(index, status) {
        if (index < 0 || !state.appts[index]) return;
        state.appts[index].status = status;
        saveData();
        renderAppointmentsTable();
      }

      function deleteAppointment(index) {
        if (index === undefined || index < 0 || !state.appts[index]) return;
        state.appts.splice(index, 1);
        saveData();
        renderConsultsTab();
        toast('Consulta removida.');
      }

      async function postJSON(url, payload) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(Array.isArray(payload) ? payload : [payload])
        });

        const text = await response.text();
        if (!response.ok) throw new Error(text || 'Erro ao sincronizar com SheetDB');
        return text;
      }

      function syncWeeksToSheetDB(date, payload) {
        const dataObject = {
          source: 'painel-kommo',
          updated_at: new Date().toISOString(),
          data_semana: date,
          novos: safeNumber(payload.novos),
          antigas: safeNumber(payload.antigas),
          ativas: safeNumber(payload.ativas),
          fu2: safeNumber(payload.fu2),
          fu3: safeNumber(payload.fu3),
          fu4: safeNumber(payload.fu4),
          fu5: safeNumber(payload.fu5),
          resp: safeNumber(payload.resp),
          m1: safeNumber(payload.m1),
          m2: safeNumber(payload.m2),
          m3: safeNumber(payload.m3),
          m4: safeNumber(payload.m4),
          m5: safeNumber(payload.m5),
          m6: safeNumber(payload.m6),
          cagend: safeNumber(payload.cagend),
          tcap: safeNumber(payload.tcap)
        };

        postJSON(SHEETDB_WEEK_URL, dataObject)
          .then(() => {
            state.sync.weeks = 'good';
            saveData();
            renderConfig();
          })
          .catch((error) => {
            console.error('SheetDB weeks error:', error);
            state.sync.weeks = 'error';
            saveData();
            renderConfig();
            toast('Erro na sincronização de semanas.');
          });
      }

      function syncAppointmentsToSheetDB(item) {
        const payload = {
          source: 'painel-kommo',
          updated_at: new Date().toISOString(),
          paciente: String(item.paciente || ''),
          origem: String(item.origem || ''),
          agendada_em: String(item.agendada_em || ''),
          data_consulta: String(item.data_consulta || ''),
          status: String(item.status || 'agendada')
        };

        postJSON(SHEETDB_CONSULTA_URL, payload)
          .then(() => {
            state.sync.appointments = 'good';
            saveData();
            renderConfig();
          })
          .catch((error) => {
            console.error('SheetDB appointments error:', error);
            state.sync.appointments = 'error';
            saveData();
            renderConfig();
            toast('Erro na sincronização de consultas.');
          });
      }

      function retrySync() {
        const allWeeks = getAllWeeksSorted();
        allWeeks.forEach(date => {
          const payload = state.weeks[date];
          if (payload) syncWeeksToSheetDB(date, payload);
        });

        state.appts.forEach(item => syncAppointmentsToSheetDB(item));

        if (!allWeeks.length && !state.appts.length) {
          state.sync.weeks = 'none';
          state.sync.appointments = 'none';
          saveData();
          renderConfig();
          toast('Nada para sincronizar no momento.');
          return;
        }

        toast('Tentativa de sincronização iniciada.');
      }

      function bindGlobalEvents() {
        const navButtons = document.querySelectorAll('[data-tab]');
        navButtons.forEach(button => {
          button.addEventListener('click', () => {
            const target = button.dataset.tab;
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById(target)?.classList.add('active');
            document.querySelectorAll('[data-tab]').forEach(btn => btn.classList.toggle('on', btn === button));
          });
        });

        document.addEventListener('click', (event) => {
          const loadWeekBtn = event.target.closest('[data-load-week]');
          if (loadWeekBtn) {
            const date = loadWeekBtn.dataset.loadWeek;
            loadWeekIntoForm(date);
            toast('Semana carregada para edição.');
            return;
          }

          const deleteWeekBtn = event.target.closest('[data-delete-week]');
          if (deleteWeekBtn) {
            const date = deleteWeekBtn.dataset.deleteWeek;
            delete state.weeks[date];
            saveData();
            renderAll();
            toast('Semana removida.');
            return;
          }

          const deleteApptBtn = event.target.closest('[data-delete-appt]');
          if (deleteApptBtn) {
            deleteAppointment(Number(deleteApptBtn.dataset.deleteAppt));
          }
        });

        document.addEventListener('change', (event) => {
          const statusSelect = event.target.closest('[data-status-id]');
          if (statusSelect) {
            const idx = Number(statusSelect.dataset.statusId);
            updateAppointmentStatus(idx, statusSelect.value);
          }
        });
      }

      function initializeLock() {
        const lockForm = document.getElementById('lockForm');
        const accessPasswordInput = document.getElementById('accessPassword');
        const lockMessage = document.getElementById('lockMessage');
        const lockScreen = document.getElementById('lockScreen');
        const appShell = document.getElementById('appShell');

        if (lockForm && accessPasswordInput && lockMessage && lockScreen && appShell) {
          lockForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const password = accessPasswordInput.value.trim();
            if (password === (state.cfg.password || ACCESS_PASSWORD)) {
              document.body.classList.remove('locked');
              lockScreen.style.display = 'none';
              appShell.style.display = 'block';
              accessPasswordInput.value = '';
              lockMessage.textContent = '';
              return;
            }
            lockMessage.textContent = 'Senha Incorreta';
            accessPasswordInput.value = '';
            accessPasswordInput.focus();
          });
        }
      }

      function renderAll() {
        applyTitle();
        renderDashboard();
        renderWeekTab();
        renderConsultsTab();
        renderConfig();
      }

      function init() {
        const loaded = loadData();
        state.weeks = loaded.weeks || {};
        state.appts = Array.isArray(loaded.appts) ? loaded.appts : [];
        state.cfg = loaded.cfg && Object.keys(loaded.cfg).length ? loaded.cfg : { ...state.cfg };
        state.sync = loaded.sync || { ...state.sync };

        initializeLock();
        bindGlobalEvents();
        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
