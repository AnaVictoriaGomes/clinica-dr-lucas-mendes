<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel KOMMO</title>
  <style>
    :root {
      --bg: #f4f6f3;
      --card: #fff;
      --ink: #16302c;
      --mut: #5f7571;
      --line: #dbe3df;
      --g: #1f7a6d;
      --a: #d99a1c;
      --b: #3d6fa8;
      --r: #c2455a;
      --k: #9aa8a4;
      --p: #7a5aa6;
      color-scheme: light;
      box-sizing: border-box;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Figtree", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body.locked { overflow: hidden; }

    .app-shell { display: none; }
    body:not(.locked) .app-shell { display: block; }

    .lock-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f7faf8 0%, #edf3f1 100%);
      z-index: 9999;
    }

    body:not(.locked) .lock-screen { display: none; }

    .lock-card {
      width: min(92vw, 380px);
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(22,48,44,.08);
      border-radius: 20px;
      padding: 28px 22px 22px;
      box-shadow: 0 20px 60px rgba(15,41,36,.18);
    }

    .lock-card h2 { margin: 0 0 14px; font-size: 26px; }
    .lock-card label {
      display: block;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--mut);
      margin-bottom: 8px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .lock-card input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .lock-card button {
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg,#1f7a6d,#2d8f7d);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #lockMessage {
      min-height: 22px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--r);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px 6px;
      max-width: 1180px;
      margin: 0 auto;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(8px);
      z-index: 10;
      border-bottom: 1px solid var(--line);
    }

    h1 { margin: 0; font-size: 22px; }
    nav {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      flex-wrap: wrap;
    }
    nav button {
      border: 0;
      background: none;
      color: var(--mut);
      font: inherit;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    nav button.on {
      background: var(--g);
      color: white;
    }

    main {
      max-width: 1180px;
      margin: auto;
      padding: 18px 22px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(16,40,36,.05), 0 6px 20px -10px rgba(16,40,36,.12);
    }

    .grid {
      display: grid;
      gap: 14px;
    }
    .kpis {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      margin-bottom: 14px;
    }

    .kpi {
      position: relative;
      overflow: hidden;
      padding: 16px 16px 14px 19px;
    }
    .kpi::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--g);
    }
    .kpi span {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--mut);
    }
    .kpi b {
      display: block;
      font-size: 30px;
      line-height: 1.1;
      margin-top: 6px;
    }
    .kpi small {
      display: block;
      margin-top: 4px;
      color: var(--mut);
      font-size: 12px;
    }

    .note {
      color: var(--mut);
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 10px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
      margin-top: 12px;
    }

    .f {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }
    .f label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--mut);
      font-size: 12px;
      font-weight: 600;
    }

    input, select, textarea, button.b {
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 38px;
    }
    button.b {
      cursor: pointer;
      background: var(--g);
      color: white;
      border-color: var(--g);
      font-weight: 600;
      min-height: 40px;
    }
    button.b.s {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    textarea { width: 100%; }
    .hide { display: none !important; }

    #toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 99999;
      background: rgba(22,48,44,.96);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0,0,0,.22);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .week-list {
      display: grid;
      gap: 10px;
    }
    .week-item {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .week-item strong { font-size: 14px; }
    .week-item small { color: var(--mut); }

    @media (max-width: 640px) {
      header { padding: 10px 14px; }
      main { padding: 14px 14px 32px; }
      .card { padding: 14px; }
      .kpi b { font-size: 26px; }
    }
  </style>
</head>
<body class="locked">
  <div id="lockScreen" class="lock-screen" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <div class="lock-card">
      <div style="font-size:42px; margin-bottom:10px;" aria-hidden="true">🔒</div>
      <h2 id="lockTitle">Senha de Acesso</h2>
      <form id="lockForm" novalidate>
        <label for="accessPassword">Senha</label>
        <input id="accessPassword" type="password" placeholder="Digite a senha" autocomplete="off" aria-label="Senha de Acesso">
        <button type="submit">Entrar</button>
        <p id="lockMessage" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <header>
      <div>
        <h1>Painel KOMMO</h1>
      </div>
      <nav id="nav">
        <button data-tab="dash" class="on">Painel</button>
        <button data-tab="sem">Lançar semana</button>
        <button data-tab="cons">Consultas</button>
      </nav>
    </header>

    <main>
      <section id="dash" class="panel"></section>

      <section id="sem" class="panel hide">
        <div class="card">
          <h2>Lançamento semanal</h2>
          <div class="row">
            <label class="note">Data da semana<br><input type="date" id="weekDate"></label>
            <button class="b s" id="copyPreviousBtn" type="button">Copiar valores da semana anterior</button>
          </div>

          <div class="f" id="weekFields"></div>

          <div class="row">
            <button class="b" id="saveWeekBtn" type="button">Salvar semana</button>
            <button class="b s" id="deleteWeekBtn" type="button">Excluir esta semana</button>
          </div>
        </div>

        <div class="card">
          <h2>Semanas lançadas</h2>
          <div id="weekList" class="week-list"></div>
        </div>
      </section>

      <section id="cons" class="panel hide">
        <div class="card">
          <h2>Registrar consulta agendada</h2>
          <div class="f">
            <label>Paciente<input id="patientName" placeholder="Nome ou iniciais"></label>
            <label>Veio de<select id="originSelect">
              <option value="Instagram">Instagram</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="Indicação">Indicação</option>
              <option value="Google">Google</option>
              <option value="Facebook">Facebook</option>
            </select></label>
            <label>Agendada em<input type="date" id="scheduledDate"></label>
            <label>Data da consulta<input type="date" id="consultationDate"></label>
          </div>
          <div class="row">
            <button class="b" id="addConsultationBtn" type="button">Adicionar consulta</button>
          </div>
        </div>

        <div class="card">
          <h2>Consultas registradas</h2>
          <div id="consultationList" class="week-list"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'kommo_dashboard_data';
    const SHEETDB_URL_DADOS_SEMANA = 'https://sheetdb.io/api/v1/hd148z3uhn04n?sheet=dados_semana';
    const SHEETDB_URL_CONSULTAS = 'https://sheetdb.io/api/v1/antynpy96prfl?sheet=consultas';

    const WEEK_FIELDS = [
      { key: 'novos', label: 'Novos leads' },
      { key: 'antigas', label: 'Conversas antigas retomadas' },
      { key: 'ativas', label: 'Total de conversas ativas' },
      { key: 'fu2', label: 'Follow-up 2' },
      { key: 'fu3', label: 'Follow-up 3' },
      { key: 'fu4', label: 'Follow-up 4' },
      { key: 'fu5', label: 'Follow-up 5' },
      { key: 'resp', label: 'Respostas' },
      { key: 'm1', label: 'Mensagens 1' },
      { key: 'm2', label: 'Mensagens 2' },
      { key: 'm3', label: 'Mensagens 3' },
      { key: 'm4', label: 'Mensagens 4' },
      { key: 'm5', label: 'Mensagens 5' },
      { key: 'm6', label: 'Mensagens 6' },
      { key: 'cagend', label: 'Consultas agendadas' },
      { key: 'tcap', label: 'Total atual' }
    ];

    const state = {
      weeks: {},
      consultations: []
    };

    const lockForm = document.getElementById('lockForm');
    const accessPasswordInput = document.getElementById('accessPassword');
    const lockMessage = document.getElementById('lockMessage');
    const toast = document.getElementById('toast');
    const nav = document.getElementById('nav');
    const panelIds = ['dash', 'sem', 'cons'];

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function getStoredData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { weeks: {}, consultations: [] };
      } catch (e) {
        return { weeks: {}, consultations: [] };
      }
    }

    function saveStoredData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        weeks: state.weeks,
        consultations: state.consultations
      }));
    }

    function safeNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function buildWeekFields() {
      const container = document.getElementById('weekFields');
      container.innerHTML = WEEK_FIELDS.map(field => `
        <label>
          ${field.label}
          <input type="number" min="0" data-key="${field.key}" value="0">
        </label>
      `).join('');
    }

    function fillWeekForm(weekData = {}) {
      const inputs = document.querySelectorAll('#weekFields input');
      inputs.forEach(input => {
        const key = input.dataset.key;
        input.value = weekData[key] ?? 0;
      });
    }

    function readWeekForm() {
      const formData = {};
      const inputs = document.querySelectorAll('#weekFields input');
      inputs.forEach(input => {
        const key = input.dataset.key;
        formData[key] = safeNumber(input.value);
      });
      return formData;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const date = new Date(dateStr + 'T00:00:00');
      if (Number.isNaN(date.getTime())) return dateStr;
      return new Intl.DateTimeFormat('pt-BR').format(date);
    }

    function getLastWeek() {
      const entries = Object.keys(state.weeks).sort();
      if (!entries.length) return null;
      return state.weeks[entries[entries.length - 1]];
    }

    function renderDashboard() {
      const dash = document.getElementById('dash');
      const last = getLastWeek();

      if (!last) {
        dash.innerHTML = `
          <div class="card">
            <h2>Ainda não há dados</h2>
            <p class="note">Vá em “Lançar semana” para cadastrar a primeira semana.</p>
          </div>
        `;
        return;
      }

      const totalFollowUp = (Number(last.fu2 || 0) + Number(last.fu3 || 0) + Number(last.fu4 || 0) + Number(last.fu5 || 0));

      dash.innerHTML = `
        <div class="grid kpis">
          <div class="card kpi">
            <span>Conversas ativas</span>
            <b>${Number(last.ativas || 0).toLocaleString('pt-BR')}</b>
          </div>
          <div class="card kpi">
            <span>Mensagens follow-up</span>
            <b>${totalFollowUp.toLocaleString('pt-BR')}</b>
            <small>acumulado</small>
          </div>
          <div class="card kpi">
            <span>Respostas</span>
            <b>${Number(last.resp || 0).toLocaleString('pt-BR')}</b>
            <small>na semana mais recente</small>
          </div>
        </div>
      `;
    }

    function renderWeekList() {
      const list = document.getElementById('weekList');
      const entries = Object.keys(state.weeks).sort().reverse();

      if (!entries.length) {
        list.innerHTML = '<p class="note">Nenhuma semana salva ainda.</p>';
        return;
      }

      list.innerHTML = entries.map(date => {
        const values = state.weeks[date];
        return `
          <div class="week-item">
            <div>
              <strong>${formatDate(date)}</strong><br>
              <small>${Number(values.ativas || 0).toLocaleString('pt-BR')} ativas · ${Number(values.resp || 0).toLocaleString('pt-BR')} respostas</small>
            </div>
            <button class="b s" type="button" data-load-week="${date}">Carregar</button>
          </div>
        `;
      }).join('');
    }

    function renderConsultationList() {
      const list = document.getElementById('consultationList');
      if (!state.consultations.length) {
        list.innerHTML = '<p class="note">Nenhuma consulta cadastrada.</p>';
        return;
      }

      list.innerHTML = state.consultations.map((item, index) => `
        <div class="week-item">
          <div>
            <strong>${item.paciente}</strong><br>
            <small>${item.origem} · ${formatDate(item.data_consulta)}</small>
          </div>
          <button class="b s" type="button" data-delete-consult="${index}">Excluir</button>
        </div>
      `).join('');
    }

    function loadWeekIntoForm(date) {
      const data = state.weeks[date];
      if (!data) return;
      document.getElementById('weekDate').value = date;
      fillWeekForm(data);
    }

    function buildWeekPayload(date, formData) {
      return {
        source: 'painel-kommo',
        updated_at: new Date().toISOString(),
        data_semana: date,
        ...formData
      };
    }

    function buildConsultationPayload() {
      const patient = document.getElementById('patientName').value.trim();
      const origin = document.getElementById('originSelect').value;
      const scheduled = document.getElementById('scheduledDate').value;
      const consultationDate = document.getElementById('consultationDate').value;

      if (!patient || !consultationDate) {
        showToast('Preencha paciente e data da consulta.');
        return null;
      }

      return {
        source: 'painel-kommo',
        updated_at: new Date().toISOString(),
        paciente: patient,
        origem: origin,
        agendada_em: scheduled,
        data_consulta: consultationDate,
        status: 'agendada',
        reagendado: '',
        observacao: ''
      };
    }

    async function postSheet(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(Array.isArray(payload) ? payload : [payload])
      });

      const text = await response.text();
      if (!response.ok) {
        throw new Error(text || 'Erro ao salvar');
      }
      return text;
    }

    async function saveWeekToSheetDB(payload) {
      try {
        await postSheet(SHEETDB_URL_DADOS_SEMANA, payload);
      } catch (error) {
        console.error('save week sheet error:', error);
        throw error;
      }
    }

    async function saveConsultationToSheetDB(payload) {
      try {
        await postSheet(SHEETDB_URL_CONSULTAS, payload);
      } catch (error) {
        console.error('save consultation sheet error:', error);
        throw error;
      }
    }

    async function saveWeek() {
      const date = document.getElementById('weekDate').value;
      if (!date) {
        showToast('Selecione a data da semana.');
        return;
      }

      const formData = readWeekForm();
      const payload = buildWeekPayload(date, formData);
      state.weeks[date] = formData;
      saveStoredData();
      renderDashboard();
      renderWeekList();

      try {
        await saveWeekToSheetDB(payload);
        showToast('Dados Salvos com Sucesso!');
      } catch (error) {
        showToast('Erro ao salvar no SheetDB.');
      }
    }

    async function saveConsultation() {
      const payload = buildConsultationPayload();
      if (!payload) return;

      state.consultations.push(payload);
      saveStoredData();
      renderConsultationList();

      try {
        await saveConsultationToSheetDB(payload);
        showToast('Dados Salvos com Sucesso!');
      } catch (error) {
        showToast('Erro ao salvar no SheetDB.');
      }

      document.getElementById('patientName').value = '';
      document.getElementById('scheduledDate').value = '';
      document.getElementById('consultationDate').value = '';
    }

    function loadStoredState() {
      const data = getStoredData();
      state.weeks = data.weeks || {};
      state.consultations = data.consultations || [];
      renderDashboard();
      renderWeekList();
      renderConsultationList();
    }

    function setupEvents() {
      document.getElementById('saveWeekBtn').addEventListener('click', saveWeek);
      document.getElementById('deleteWeekBtn').addEventListener('click', () => {
        const date = document.getElementById('weekDate').value;
        if (!date) return;
        delete state.weeks[date];
        saveStoredData();
        renderDashboard();
        renderWeekList();
        document.getElementById('weekDate').value = '';
        fillWeekForm();
        showToast('Semana removida do painel.');
      });

      document.getElementById('copyPreviousBtn').addEventListener('click', () => {
        const keys = Object.keys(state.weeks).sort();
        if (!keys.length) {
          showToast('Nenhuma semana anterior para copiar.');
          return;
        }
        const previous = state.weeks[keys[keys.length - 1]];
        fillWeekForm(previous);
      });

      document.getElementById('addConsultationBtn').addEventListener('click', saveConsultation);

      nav.addEventListener('click', function (event) {
        const target = event.target.closest('button[data-tab]');
        if (!target) return;

        const tab = target.dataset.tab;
        panelIds.forEach(id => {
          const panel = document.getElementById(id);
          if (panel) {
            panel.classList.toggle('hide', id !== tab);
          }
        });

        nav.querySelectorAll('button').forEach(btn => btn.classList.toggle('on', btn === target));
      });

      document.getElementById('weekList').addEventListener('click', function (event) {
        const btn = event.target.closest('[data-load-week]');
        if (!btn) return;
        loadWeekIntoForm(btn.dataset.loadWeek);
      });

      document.getElementById('consultationList').addEventListener('click', function (event) {
        const btn = event.target.closest('[data-delete-consult]');
        if (!btn) return;
        const index = Number(btn.dataset.deleteConsult);
        state.consultations.splice(index, 1);
        saveStoredData();
        renderConsultationList();
      });
    }

    lockForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const password = accessPasswordInput.value.trim();
      if (password === 'Lucas830') {
        document.body.classList.remove('locked');
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('appShell').style.display = 'block';
        accessPasswordInput.value = '';
        lockMessage.textContent = '';
        return;
      }
      lockMessage.textContent = 'Senha Incorreta';
      accessPasswordInput.value = '';
      accessPasswordInput.focus();
    });

    function init() {
      buildWeekFields();
      fillWeekForm();
      setupEvents();
      loadStoredState();
      document.getElementById('weekDate').value = new Date().toISOString().slice(0, 10);
    }

    init();
  </script>
</body>
</html>
